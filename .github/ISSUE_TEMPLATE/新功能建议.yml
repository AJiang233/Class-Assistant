name: 新功能建议
description: 提出一个新功能或改进建议
title: "新功能："
labels:
  - 未分类
assignees: []
# 如果仓库未启用 Issue Types，可删除下面一行
type: Feature

body:
  - type: checkboxes
    id: preflight
    attributes:
      label: 提交前检查
      options:
        - label: 我已搜索过现有 issue，确认没有重复建议
          required: true
        - label: 我已确认该功能与项目目标相关
          required: true

  - type: textarea
    id: problem
    attributes:
      label: 要解决的问题
      description: 这个功能建议是为了解决什么问题？请描述你的痛点或使用场景
      placeholder: 请描述你的痛点或使用场景...
    validations:
      required: true

  - type: textarea
    id: expected_solution
    attributes:
      label: 期望的解决方案
      description: 你希望项目增加什么功能？它应该如何工作？
      placeholder: 请描述期望的功能和它的工作方式...
    validations:
      required: false

  - type: textarea
    id: implementation
    attributes:
      label: 实现方案
      description: 你是否有什么好的实现方案？可选内容
      placeholder: 可选，请描述实现思路...
    validations:
      required: false

  - type: textarea
    id: examples
    attributes:
      label: 示例 / 参考
      description: 截图、伪代码、类似项目链接等
      placeholder: 可选，请提供截图、链接或伪代码...
    validations:
      required: false

  - type: dropdown
    id: priority
    attributes:
      label: 优先级
      description: 请选择该功能的优先级
      options:
        - 很需要，影响主要使用流程
        - 比较需要，有临时方案
        - 锦上添花
    validations:
      required: true

  - type: checkboxes
    id: contribution
    attributes:
      label: 贡献意愿
      options:
        - label: 我愿意提交 PR 实现这个功能
          required: false
