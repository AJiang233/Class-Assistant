name: 反馈 Bug
description: 提交一个 Bug，帮助我们定位和修复问题
title: "Bug："
labels:
  - 未分类
assignees: []
type: Bug

body:
  - type: checkboxes
    id: preflight
    attributes:
      label: 提交前检查
      options:
        - label: 我已搜索过现有 issue，确认没有重复反馈
          required: true
        - label: 我已阅读相关文档/FAQ，确认这不是使用问题
          required: true
        - label: 我可以在最新版本中复现该问题
          required: true

  - type: textarea
    id: bug_description
    attributes:
      label: Bug 描述
      description: 清晰简洁地描述这个 Bug 是什么
      placeholder: 请描述这个 Bug...
    validations:
      required: true

  - type: textarea
    id: reproduce_steps
    attributes:
      label: 复现步骤
      description: 请提供可复现该问题的步骤
      placeholder: |
        1. 
        2. 
        3. 
    validations:
      required: false

  - type: textarea
    id: logs_screenshots
    attributes:
      label: 错误日志 / 截图
      description: 粘贴控制台、终端日志或截图。请勿包含密钥、Token 等敏感信息
      placeholder: |
        粘贴日志，或将截图拖拽到此处...
      render: shell
    validations:
      required: false
