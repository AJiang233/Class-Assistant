name: 提交优化建议
description: 提交需要优化的部分，帮助我们改进体验和功能
title: "优化："
labels:
  - 未分类
assignees: []
type: Feature

body:
  - type: checkboxes
    id: preflight
    attributes:
      label: 提交前检查
      options:
        - label: 我已搜索过现有 issue，确认没有重复反馈
          required: true
        - label: 我已阅读相关文档/FAQ，确认这不是使用问题
          required: true
        - label: 我确认该优化点适用于最新版本
          required: true

  - type: textarea
    id: optimization_target
    attributes:
      label: 需要优化的部分
      description: 请指出功能、页面、流程、文档或交互中需要优化的地方
      placeholder: 例如：设置页面的保存流程、文档中的安装说明...
    validations:
      required: true

  - type: textarea
    id: current_behavior
    attributes:
      label: 当前表现
      description: 目前是什么样？存在哪些不便、低效或不合理之处？
      placeholder: 当前...
    validations:
      required: true

  - type: dropdown
    id: priority
    attributes:
      label: 优先级
      description: 请选择你认为的优先级
      options:
        - 低：影响较小，不阻塞使用，可后续处理
        - 中：有一定影响，建议排期优化
        - 高：明显影响使用体验或效率，建议尽快处理
        - 紧急：阻塞核心流程或存在较大风险，需优先处理
    validations:
      required: false

  - type: textarea
    id: additional_info
    attributes:
      label: 补充信息 / 截图
      description: 可粘贴截图、录屏、相关链接等。请勿包含密钥、Token 等敏感信息
      placeholder: 粘贴补充信息，或将截图拖拽到此处...
      render: markdown
    validations:
      required: false
