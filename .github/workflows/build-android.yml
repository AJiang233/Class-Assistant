name: Build Android APK

on:
  workflow_dispatch:
    inputs:
      version_name:
        description: '版本名，例如 1.0.0'
        required: true
        default: '1.0.0'
      version_code:
        description: '版本号（整数），例如 1'
        required: true
        default: '1'

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: 'temurin'

      - name: Setup Android SDK
        uses: android-actions/setup-android@v3

      - name: Grant execute permission for gradlew
        run: chmod +x android/gradlew

      - name: Inject version into build.gradle.kts
        env:
          VERSION_CODE: ${{ github.event.inputs.version_code }}
          VERSION_NAME: ${{ github.event.inputs.version_name }}
        run: |
          # Kotlin 没有前导零字面量，00101 会让脚本编译直接失败，所以先规整成纯十进制整数
          if ! [[ "$VERSION_CODE" =~ ^[0-9]+$ ]]; then
            echo "::error::version_code 必须是纯数字，收到：$VERSION_CODE"
            exit 1
          fi
          VERSION_CODE=$((10#$VERSION_CODE))
          sed -i -E "s/versionCode = .*/versionCode = $VERSION_CODE/" android/app/build.gradle.kts
          sed -i -E "s/versionName = .*/versionName = \"$VERSION_NAME\"/" android/app/build.gradle.kts
          grep -nE "versionCode|versionName" android/app/build.gradle.kts

      - name: Restore keystore
        env:
          # keystore 不进仓库（.gitignore 有 *.jks / *.keystore），只以 base64 存在仓库 Secrets
          KEYSTORE_BASE64: ${{ secrets.KEYSTORE_BASE64 }}
        run: |
          if [ -z "$KEYSTORE_BASE64" ]; then
            echo "::error::缺少 Secrets.KEYSTORE_BASE64，正式签名构建无法进行（生成方式见 README 的安卓端一节）"
            exit 1
          fi
          echo "$KEYSTORE_BASE64" | base64 -d > "$RUNNER_TEMP/release.jks"
          echo "CA_KEYSTORE_FILE=$RUNNER_TEMP/release.jks" >> "$GITHUB_ENV"

      - name: Build Release APK
        env:
          CA_KEYSTORE_PASSWORD: ${{ secrets.KEYSTORE_PASSWORD }}
          CA_KEY_ALIAS: ${{ secrets.KEY_ALIAS }}
          CA_KEY_PASSWORD: ${{ secrets.KEY_PASSWORD }}
        run: ./gradlew assembleRelease
        working-directory: android

      - name: Rename APK
        # 路径写死 app-release.apk：签名配置没生效时产物叫 app-release-unsigned.apk，
        # 这一步会直接失败，不会把未签名包当正式包传上去
        run: |
          mv android/app/build/outputs/apk/release/app-release.apk \
             android/app/build/outputs/apk/release/ClassAssistant-${{ github.event.inputs.version_name }}.apk

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: ClassAssistant-${{ github.event.inputs.version_name }}
          path: android/app/build/outputs/apk/release/ClassAssistant-${{ github.event.inputs.version_name }}.apk
