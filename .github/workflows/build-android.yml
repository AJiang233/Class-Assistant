name: Build Android APK

on:
  workflow_dispatch:
    inputs:
      version_name:
        description: '版本名，例如 1.0.0'
        required: true
        default: '1.0.0'
      version_code:
        description: '版本号（整数），例如 1'
        required: true
        default: '1'

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: 'temurin'

      - name: Setup Android SDK
        uses: android-actions/setup-android@v3

      - name: Grant execute permission for gradlew
        run: chmod +x android/gradlew

      - name: Inject version into build.gradle.kts
        run: |
          sed -i -E "s/versionCode = .*/versionCode = ${{ github.event.inputs.version_code }}/" android/app/build.gradle.kts
          sed -i -E "s/versionName = .*/versionName = \"${{ github.event.inputs.version_name }}\"/" android/app/build.gradle.kts
          grep -nE "versionCode|versionName" android/app/build.gradle.kts

      - name: Build Debug APK
        run: ./gradlew assembleDebug
        working-directory: android

      - name: Rename APK
        run: |
          mv android/app/build/outputs/apk/debug/app-debug.apk \
             android/app/build/outputs/apk/debug/ClassAssistant-${{ github.event.inputs.version_name }}.apk

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: ClassAssistant-${{ github.event.inputs.version_name }}
          path: android/app/build/outputs/apk/debug/ClassAssistant-${{ github.event.inputs.version_name }}.apk
