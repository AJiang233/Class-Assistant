<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
    <title>班级助理</title>
    <meta name="description" content="班级助理：集中查看班级通知与活动。">
    <meta name="color-scheme" content="light dark">
    <meta name="theme-color" content="#f2f2f7" media="(prefers-color-scheme: light)">
    <meta name="theme-color" content="#07070c" media="(prefers-color-scheme: dark)">
    <link rel="icon" type="image/png" sizes="192x192" href="assets/icons/icon-192.png">
    <link rel="icon" type="image/png" sizes="512x512" href="assets/icons/icon-512.png">
    <link rel="manifest" href="manifest.json">
    <link rel="apple-touch-icon" href="assets/icons/apple-touch-icon.png">
    <!-- iOS 加到主屏后独立运行（无地址栏）。状态栏用 default：iOS 会为状态栏预留空间，
         内容不被刘海/状态栏压住；不用 black-translucent —— 它固定白色状态栏文字，浅色主题下看不见。 -->
    <meta name="apple-mobile-web-app-capable" content="yes">
    <meta name="mobile-web-app-capable" content="yes">
    <meta name="apple-mobile-web-app-status-bar-style" content="default">
    <meta name="apple-mobile-web-app-title" content="班级助理">
    <link rel="stylesheet" href="assets/css/style.css">
    <script src="assets/js/theme.js"></script>
</head>
<body>
    <!-- 应用壳（未登录也显示，登录后加载活动） -->
    <div class="app-shell" id="appShell">
        <aside class="sidebar" id="sidebar">
            <a href="index.html" class="sidebar-brand">
                <span class="brand-mark">
                    <img src="assets/icons/icon-192.png" alt="">
                </span>
                <span class="brand-text">班级助理</span>
            </a>
            <nav class="sidebar-nav">
                <button type="button" class="side-link active" id="navHome" data-view="home">
                    <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.75" stroke-linecap="round" stroke-linejoin="round"><path d="M3 9l9-7 9 7v11a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2z"/><polyline points="9 22 9 12 15 12 15 22"/></svg>
                    <span class="side-text">我的主页</span>
                </button>
                <!-- 班级事务（issue #95）：通知与活动合并成一个入口，页内用子标签切换；
                     手机端选项卡从 6 个回到 5 个，同时把「我的待办」放进底栏。 -->
                <button type="button" class="side-link" id="navAffairs" data-view="affairs">
                    <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.75" stroke-linecap="round" stroke-linejoin="round"><polyline points="22 12 16 12 14 15 10 15 8 12 2 12"/><path d="M5.45 5.11 2 12v6a2 2 0 0 0 2 2h16a2 2 0 0 0 2-2v-6l-3.45-6.89A2 2 0 0 0 16.76 4H7.24a2 2 0 0 0-1.79 1.11z"/></svg>
                    <span class="side-text">班级事务</span>
                </button>
                <!-- 待办（决策 1.C）：列表在主页面之外的独立子页 /todos/，
                     侧栏这一项只是切 iframe，与通知/活动同一套导航机制。 -->
                <button type="button" class="side-link" id="navTodos" data-view="todos">
                    <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.75" stroke-linecap="round" stroke-linejoin="round"><path d="M9 11l3 3L22 4"/><path d="M21 12v7a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2V5a2 2 0 0 1 2-2h11"/></svg>
                    <span class="side-text">我的待办</span>
                </button>
                <button type="button" class="side-link" id="navAcademic" data-view="academic">
                    <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.75" stroke-linecap="round" stroke-linejoin="round"><rect x="3" y="3" width="7" height="7" rx="1.5"/><rect x="14" y="3" width="7" height="7" rx="1.5"/><rect x="14" y="14" width="7" height="7" rx="1.5"/><rect x="3" y="14" width="7" height="7" rx="1.5"/></svg>
                    <span class="side-text">学业</span>
                </button>
                <button type="button" class="side-link" id="navAdmin" hidden data-view="admin">
                    <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.75" stroke-linecap="round" stroke-linejoin="round"><path d="M12 22s8-4 8-10V5l-8-3-8 3v7c0 6 8 10 8 10z"/><path d="M9 12l2 2 4-4"/></svg>
                    <span class="side-text">管理员面板</span>
                </button>
                <button type="button" class="side-link" id="navAccount" data-view="account">
                    <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.75" stroke-linecap="round" stroke-linejoin="round"><path d="M20 21v-2a4 4 0 0 0-4-4H8a4 4 0 0 0-4 4v2"/><circle cx="12" cy="7" r="4"/></svg>
                    <span class="side-text">个人中心</span>
                </button>
            </nav>
            <div class="sidebar-bottom">
                <div class="sidebar-tools">
                    <button type="button" class="side-link" id="collapseBtn">
                        <span class="side-icon">
                            <svg class="icon-open" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><polyline points="15 18 9 12 15 6"/></svg>
                            <svg class="icon-close" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><polyline points="9 18 15 12 9 6"/></svg>
                        </span>
                        <span class="side-text">折叠侧栏</span>
                    </button>
                    <button type="button" class="side-link tgl-btn" id="appThemeToggle">
                        <span class="side-icon">
                            <svg class="icon-sun" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><circle cx="12" cy="12" r="4"/><path d="M12 2v2M12 20v2M4.93 4.93l1.41 1.41M17.66 17.66l1.41 1.41M2 12h2M20 12h2M6.34 17.66l-1.41 1.41M19.07 4.93l-1.41 1.41"/></svg>
                            <svg class="icon-moon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M21 12.79A9 9 0 1 1 11.21 3 7 7 0 0 0 21 12.79z"/></svg>
                        </span>
                        <span class="side-text">夜间模式</span>
                    </button>
                </div>
                <div id="authArea"><!-- 登录态由 JS 填充 --></div>
            </div>
        </aside>
        <div class="app-content">
            <!-- 主页视图：左日历 + 右「待办 / 通知 / 活动 / 表单」四块同级竖排 -->
            <div class="app-view" id="homeView">
                <div class="main">
                    <div class="container">
                    <div class="page-head">
                        <!-- 前两行是随时间段变的问候（issue #75），由 index.js 的 renderGreeting() 填：
                             留空而不是写死，是因为过了时段那句写死的文案就变成错的了。 -->
                        <h1 class="page-title" id="homeTitle"></h1>
                        <p class="page-desc" id="homeDesc"></p>
                    </div>
                    <div class="beta-banner">
                        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><circle cx="12" cy="12" r="10"/><line x1="12" y1="16" x2="12" y2="12"/><line x1="12" y1="8" x2="12.01" y2="8"/></svg>
                        <span>1.0版本公测中，仍在修复bug，敬请留意</span>
                    </div>
                    <!-- 待办摘要（决策 1.C）：首页只放一条摘要，不把整个待办页搬进来。
                         与「当前通知 / 今日活动 / 我的表单」同级：标题在 .section-head 里、卡片在下面，
                         四块同列竖排（见 .home-right）。
                         默认 hidden，由 index.js 的 loadTodoSummary() 拉到数据后再显示，
                         这样登录前的空壳里不会先闪一条「暂无待办」。 -->
                    <div class="home-layout">
                        <div class="calendar">
                            <div class="cal-head">
                                <span class="cal-title" id="calTitle"></span>
                                <div class="cal-nav">
                                    <button type="button" class="cal-today-btn" title="回到今天" data-act="cal-today">今天</button>
                                    <button type="button" class="icon-btn" title="上个月" data-act="cal-prev">
                                        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><polyline points="15 18 9 12 15 6"/></svg>
                                    </button>
                                    <button type="button" class="icon-btn" title="下个月" data-act="cal-next">
                                        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><polyline points="9 18 15 12 9 6"/></svg>
                                    </button>
                                </div>
                            </div>
                            <div class="cal-week"><span>一</span><span>二</span><span>三</span><span>四</span><span>五</span><span>六</span><span>日</span></div>
                            <div class="cal-grid" id="calGrid"></div>
                        </div>
                        <div class="home-right">
                            <section class="section-block" id="todoSummary" hidden>
                                <div class="section-head">
                                    <h2 class="section-title">待办</h2>
                                    <button type="button" class="btn btn-outline btn-sm" data-view="todos">查看全部</button>
                                </div>
                                <div class="todo-summary-card">
                                    <p class="todo-summary-line" id="todoSummaryLine">暂无待办</p>
                                    <div class="todo-summary-list" id="todoSummaryList"></div>
                                </div>
                            </section>
                            <div class="section-block">
                                <div class="section-head">
                                    <h2 class="section-title" id="noticeDateTitle">当前通知</h2>
                                    <button type="button" class="btn btn-outline btn-sm" data-view="notices">查看全部</button>
                                </div>
                                <div class="list" id="noticeList"></div>
                            </div>
                            <div class="section-block">
                                <div class="section-head">
                                    <h2 class="section-title" id="scheduleDateTitle">今日活动</h2>
                                    <button type="button" class="btn btn-outline btn-sm" data-view="activities">查看全部</button>
                                </div>
                                <div class="list" id="activityList"></div>
                            </div>
                            <div class="section-block">
                                <div class="section-head">
                                    <h2 class="section-title">我的表单</h2>
                                </div>
                                <div class="list" id="formList"></div>
                            </div>
                        </div>
                    </div>
                    </div>
                </div>

                <!-- 详情弹窗（点击"当日活动/当日通知"行弹出） -->
                <div class="modal-overlay" id="detailModal">
                    <div class="modal">
                        <div class="modal-head">
                            <span class="modal-title" id="detailModalTitle">活动详情</span>
                            <button type="button" class="modal-close" data-act="close-detail" aria-label="关闭">
                                <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><line x1="18" y1="6" x2="6" y2="18"/><line x1="6" y1="6" x2="18" y2="18"/></svg>
                            </button>
                        </div>
                        <div class="modal-body" id="detailCard"></div>
                    </div>
                </div>
            </div>

            <!-- 登录视图 -->
            <div class="app-view" id="loginView" hidden>
                <div class="login-wrap">
                    <div class="login-panel">
                        <div class="auth-brand">
                            <span class="brand-mark auth-mark">
                                <img src="assets/icons/icon-192.png" alt="">
                            </span>
                            <h1 class="auth-title">登录班级助理</h1>
                        </div>
                        <div class="form-error" id="loginError"></div>
                        <form id="loginForm" novalidate>
                            <div class="form-field">
                                <label class="form-label" for="loginStudentId">学号</label>
                                <input class="form-input" type="text" id="loginStudentId" placeholder="请输入学号" autocomplete="username">
                            </div>
                            <div class="form-field">
                                <label class="form-label" for="loginPassword">密码</label>
                                <input class="form-input" type="password" id="loginPassword" placeholder="请输入密码" autocomplete="current-password">
                            </div>
                            <button class="btn btn-primary btn-block" id="loginBtn" type="submit">登录</button>
                        </form>
                        <!-- 忘记密码：本期只有后端接口（/api/auth/forgot/*），页面不做流程，
                             所以这里如实写成「找班委重置」而不是给一个点不动的入口。
                             哪天把找回页面做出来，把这句话换成入口即可。 -->
                        <p class="auth-note">忘记密码？请联系班长或团支书重置。</p>
                        <!-- 登录前就把「会代替你访问校方系统」说清楚（issue #105）：拿到密码之前
                             应当知道这份授权意味着什么，入口指向站内法务页。 -->
                        <p class="auth-note">使用教务 / 学习通联动时，班级助理会在你授权后代替你访问校方系统，详情见<a class="legal-back" href="legal/privacy.html" target="_blank" rel="noopener">隐私政策</a>与<a class="legal-back" href="legal/disclaimer.html" target="_blank" rel="noopener">免责声明</a>。</p>
                    </div>
                </div>

            </div>

            <!-- 各视图独立 iframe -->
            <iframe id="frameActivities" class="app-frame" data-loaded="0" hidden title="活动"></iframe>
            <iframe id="frameAcademic" class="app-frame" data-loaded="0" hidden title="学业"></iframe>
            <iframe id="frameNotices" class="app-frame" data-loaded="0" hidden title="通知"></iframe>
            <iframe id="frameTodos" class="app-frame" data-loaded="0" hidden title="待办"></iframe>
            <iframe id="frameAccount" class="app-frame" data-loaded="0" hidden title="个人中心"></iframe>
            <iframe id="frameAdmin" class="app-frame" data-loaded="0" hidden title="管理员面板"></iframe>
        </div>

        <!-- 移动端底部导航（小屏显示，替代侧边栏） -->
        <nav class="bottom-nav" id="bottomNav">
            <span class="bottom-nav-pill" id="bottomNavPill" aria-hidden="true"></span>
            <!-- 导航项写成真链接：脚本万一没绑上（缓存半旧、某个顶层语句抛错），点一下也能整页跳到目标视图，
                 不至于卡在某一页。href 与 data-view 必须一致，脚本拦截后就改成无刷新切换。 -->
            <a class="bottom-nav-item active" data-nav="home" data-view="home" href="?view=home">
                <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.75" stroke-linecap="round" stroke-linejoin="round"><path d="M3 9l9-7 9 7v11a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2z"/><polyline points="9 22 9 12 15 12 15 22"/></svg>
                <span>我的主页</span>
            </a>
            <a class="bottom-nav-item" data-nav="affairs" data-view="affairs" href="?view=affairs">
                <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.75" stroke-linecap="round" stroke-linejoin="round"><polyline points="22 12 16 12 14 15 10 15 8 12 2 12"/><path d="M5.45 5.11 2 12v6a2 2 0 0 0 2 2h16a2 2 0 0 0 2-2v-6l-3.45-6.89A2 2 0 0 0 16.76 4H7.24a2 2 0 0 0-1.79 1.11z"/></svg>
                <span>班级事务</span>
            </a>
            <a class="bottom-nav-item" data-nav="todos" data-view="todos" href="?view=todos">
                <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.75" stroke-linecap="round" stroke-linejoin="round"><path d="M9 11l3 3L22 4"/><path d="M21 12v7a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2V5a2 2 0 0 1 2-2h11"/></svg>
                <span>我的待办</span>
            </a>
            <a class="bottom-nav-item" data-nav="academic" data-view="academic" href="?view=academic">
                <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.75" stroke-linecap="round" stroke-linejoin="round"><rect x="3" y="3" width="7" height="7" rx="1.5"/><rect x="14" y="3" width="7" height="7" rx="1.5"/><rect x="14" y="14" width="7" height="7" rx="1.5"/><rect x="3" y="14" width="7" height="7" rx="1.5"/></svg>
                <span>学业</span>
            </a>
            <a class="bottom-nav-item" data-nav="account" data-view="account" href="?view=account">
                <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.75" stroke-linecap="round" stroke-linejoin="round"><path d="M20 21v-2a4 4 0 0 0-4-4H8a4 4 0 0 0-4 4v2"/><circle cx="12" cy="7" r="4"/></svg>
                <span>个人中心</span>
            </a>
        </nav>
    </div>

    <!-- 用户协议弹窗（两种场景共用：登录前 412 同意；已登录老用户启动时补同意）。
         正文从 legal/terms.html 注入，同意按钮要等正文滑到底部才可点；勾选项默认全不勾，
         其中第 1 项《用户协议》是必选。弹窗放在登录视图外面，是因为已登录补同意时
         登录视图是 hidden 的，放在里面会看不见。 -->
    <div class="modal-overlay" id="consentModal">
        <div class="modal modal-consent">
            <div class="modal-head">
                <span class="modal-title">用户协议与授权</span>
                <button type="button" class="modal-close" id="consentCloseBtn" aria-label="关闭">
                    <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><line x1="18" y1="6" x2="6" y2="18"/><line x1="6" y1="6" x2="18" y2="18"/></svg>
                </button>
            </div>
            <div class="modal-body">
                <p class="consent-lead" id="consentLead">使用本服务前，请先阅读《用户协议》并确认下方授权；下滑到正文底部后即可点击「同意并登录」。</p>
                <div class="consent-doc" id="consentDoc" tabindex="0">正在加载协议正文…</div>
                <p class="consent-scroll-hint" id="consentScrollHint">请向下滑动阅读至底部</p>
                <div class="consent-checks">
                    <label class="consent-check">
                        <input type="checkbox" id="consentTerms">
                        <span class="consent-check-text">同意本软件用户协议<small>如不同意将无法使用我们的服务</small></span>
                    </label>
                    <label class="consent-check">
                        <input type="checkbox" id="consentChaoxing">
                        <span class="consent-check-text">同意本软件使用你的身份登录学习通<small>如不同意将无法同步学习通作业，考试等消息</small></span>
                    </label>
                    <label class="consent-check">
                        <input type="checkbox" id="consentAcademic">
                        <span class="consent-check-text">同意本软件使用你的身份登录教务系统<small>如不同意将无法同步教务系统学业情况及课表</small></span>
                    </label>
                </div>
                <div class="form-error" id="consentError"></div>
            </div>
            <div class="modal-foot">
                <button type="button" class="btn btn-outline" id="consentCancelBtn">取消</button>
                <button type="button" class="btn btn-primary" id="consentAgreeBtn" disabled>同意并登录</button>
            </div>
        </div>
    </div>

    <script src="assets/js/app.js"></script>
    <script src="assets/js/index.js"></script>
</body>
</html>
