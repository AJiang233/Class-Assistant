<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
    <title>班级助理</title>
    <meta name="description" content="班级助理：集中查看班级通知与活动。">
    <meta name="color-scheme" content="light dark">
    <meta name="theme-color" content="#f2f2f7" media="(prefers-color-scheme: light)">
    <meta name="theme-color" content="#07070c" media="(prefers-color-scheme: dark)">
    <link rel="icon" type="image/svg+xml" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='58 50 396 396'%3E%3Cdefs%3E%3Cmask id='ca-line-ko' maskUnits='userSpaceOnUse' x='-256' y='-256' width='1024' height='1024'%3E%3Crect x='-256' y='-256' width='1024' height='1024' fill='%23ffffff'/%3E%3Cpath d='M282,93 H390 A30,30 0 0 1 420,123 V175 A30,30 0 0 1 390,205 H338 L292,241 L304,205 H282 A30,30 0 0 1 252,175 V123 A30,30 0 0 1 282,93 Z' fill='%23000000' stroke='%23000000' stroke-width='36' stroke-linejoin='round' stroke-linecap='round'/%3E%3C/mask%3E%3C/defs%3E%3Cg mask='url(%23ca-line-ko)' fill='none' stroke='%23007aff' stroke-width='28' stroke-linecap='round' stroke-linejoin='round'%3E%3Cpath d='M92,175 A172,172 0 0 1 232,208 L232,387 A172,172 0 0 0 92,354 Z'/%3E%3Cpath d='M372,175 A172,172 0 0 0 232,208 L232,387 A172,172 0 0 1 372,354 Z'/%3E%3C/g%3E%3Cpath d='M282,93 H390 A30,30 0 0 1 420,123 V175 A30,30 0 0 1 390,205 H338 L292,241 L304,205 H282 A30,30 0 0 1 252,175 V123 A30,30 0 0 1 282,93 Z' fill='none' stroke='%23007aff' stroke-width='28' stroke-linejoin='round' stroke-linecap='round'/%3E%3C/svg%3E">
    <link rel="icon" type="image/png" sizes="192x192" href="assets/icons/icon-line-192.png">
    <link rel="icon" type="image/png" sizes="512x512" href="assets/icons/icon-line-512.png">
    <link rel="manifest" href="manifest.json">
    <link rel="apple-touch-icon" href="assets/icons/apple-touch-icon.png">
    <!-- iOS 加到主屏后独立运行（无地址栏）。状态栏用 default：iOS 会为状态栏预留空间，
         内容不被刘海/状态栏压住；不用 black-translucent —— 它固定白色状态栏文字，浅色主题下看不见。 -->
    <meta name="apple-mobile-web-app-capable" content="yes">
    <meta name="mobile-web-app-capable" content="yes">
    <meta name="apple-mobile-web-app-status-bar-style" content="default">
    <meta name="apple-mobile-web-app-title" content="班级助理">
    <link rel="stylesheet" href="assets/css/style.css">
    <script src="assets/js/theme.js"></script>
</head>
<body>
    <!-- 应用壳（未登录也显示，登录后加载活动） -->
    <div class="app-shell" id="appShell">
        <aside class="sidebar" id="sidebar">
            <a href="index.html" class="sidebar-brand">
                <span class="brand-mark">
                    <svg width="15" height="15" viewBox="0 0 24 24"><defs><mask id="caMarkKnockoutNav" maskUnits="userSpaceOnUse" x="-256" y="-256" width="1024" height="1024"><rect x="-256" y="-256" width="1024" height="1024" fill="#fff"/><path d="M282,93 H390 A30,30 0 0 1 420,123 V175 A30,30 0 0 1 390,205 H338 L292,241 L304,205 H282 A30,30 0 0 1 252,175 V123 A30,30 0 0 1 282,93 Z" fill="#000" stroke="#000" stroke-width="36" stroke-linejoin="round" stroke-linecap="round"/><rect x="215" y="150" width="34" height="270" fill="#000"/></mask></defs><g transform="translate(-4.78 -3.73) scale(0.06555)"><g mask="url(#caMarkKnockoutNav)" fill="#fff"><path d="M92,175 A172,172 0 0 1 232,208 L232,387 A172,172 0 0 0 92,354 Z"/><path d="M372,175 A172,172 0 0 0 232,208 L232,387 A172,172 0 0 1 372,354 Z"/></g><path d="M282,93 H390 A30,30 0 0 1 420,123 V175 A30,30 0 0 1 390,205 H338 L292,241 L304,205 H282 A30,30 0 0 1 252,175 V123 A30,30 0 0 1 282,93 Z" fill="#fff"/></g></svg>
                </span>
                <span class="brand-text">班级助理</span>
            </a>
            <nav class="sidebar-nav">
                <button type="button" class="side-link active" id="navHome" data-view="home">
                    <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.75" stroke-linecap="round" stroke-linejoin="round"><path d="M3 9l9-7 9 7v11a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2z"/><polyline points="9 22 9 12 15 12 15 22"/></svg>
                    <span class="side-text">我的主页</span>
                </button>
                <button type="button" class="side-link" id="navNotices" data-view="notices">
                    <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.75" stroke-linecap="round" stroke-linejoin="round"><path d="M14 2H6a2 2 0 0 0-2 2v16a2 2 0 0 0 2 2h12a2 2 0 0 0 2-2V8z"/><polyline points="14 2 14 8 20 8"/><line x1="16" y1="13" x2="8" y2="13"/><line x1="16" y1="17" x2="8" y2="17"/></svg>
                    <span class="side-text">班级通知</span>
                </button>
                <button type="button" class="side-link" id="navActivities" data-view="activities">
                    <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.75" stroke-linecap="round" stroke-linejoin="round"><rect x="3" y="4" width="18" height="18" rx="2" ry="2"/><line x1="16" y1="2" x2="16" y2="6"/><line x1="8" y1="2" x2="8" y2="6"/><line x1="3" y1="10" x2="21" y2="10"/></svg>
                    <span class="side-text">班级活动</span>
                </button>
                <button type="button" class="side-link" id="navAcademic" data-view="academic">
                    <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.75" stroke-linecap="round" stroke-linejoin="round"><rect x="3" y="3" width="7" height="7" rx="1.5"/><rect x="14" y="3" width="7" height="7" rx="1.5"/><rect x="14" y="14" width="7" height="7" rx="1.5"/><rect x="3" y="14" width="7" height="7" rx="1.5"/></svg>
                    <span class="side-text">学业</span>
                </button>
                <button type="button" class="side-link" id="navAdmin" hidden data-view="admin">
                    <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.75" stroke-linecap="round" stroke-linejoin="round"><path d="M12 22s8-4 8-10V5l-8-3-8 3v7c0 6 8 10 8 10z"/><path d="M9 12l2 2 4-4"/></svg>
                    <span class="side-text">管理员面板</span>
                </button>
                <button type="button" class="side-link" id="navAccount" data-view="account">
                    <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.75" stroke-linecap="round" stroke-linejoin="round"><path d="M20 21v-2a4 4 0 0 0-4-4H8a4 4 0 0 0-4 4v2"/><circle cx="12" cy="7" r="4"/></svg>
                    <span class="side-text">个人中心</span>
                </button>
            </nav>
            <div class="sidebar-bottom">
                <div class="sidebar-tools">
                    <button type="button" class="side-link" id="collapseBtn">
                        <span class="side-icon">
                            <svg class="icon-open" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><polyline points="15 18 9 12 15 6"/></svg>
                            <svg class="icon-close" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><polyline points="9 18 15 12 9 6"/></svg>
                        </span>
                        <span class="side-text">折叠侧栏</span>
                    </button>
                    <button type="button" class="side-link tgl-btn" id="appThemeToggle">
                        <span class="side-icon">
                            <svg class="icon-sun" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><circle cx="12" cy="12" r="4"/><path d="M12 2v2M12 20v2M4.93 4.93l1.41 1.41M17.66 17.66l1.41 1.41M2 12h2M20 12h2M6.34 17.66l-1.41 1.41M19.07 4.93l-1.41 1.41"/></svg>
                            <svg class="icon-moon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M21 12.79A9 9 0 1 1 11.21 3 7 7 0 0 0 21 12.79z"/></svg>
                        </span>
                        <span class="side-text">夜间模式</span>
                    </button>
                </div>
                <div id="authArea"><!-- 登录态由 JS 填充 --></div>
            </div>
        </aside>
        <div class="app-content">
            <!-- 主页视图：左日历 + 右通知/活动 -->
            <div class="app-view" id="homeView">
                <div class="main">
                    <div class="container">
                    <div class="page-head">
                        <!-- 前两行是随时间段变的问候（issue #75），由 index.js 的 renderGreeting() 填：
                             留空而不是写死，是因为过了时段那句写死的文案就变成错的了。 -->
                        <h1 class="page-title" id="homeTitle"></h1>
                        <p class="page-desc" id="homeDesc"></p>
                    </div>
                    <div class="beta-banner">
                        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><circle cx="12" cy="12" r="10"/><line x1="12" y1="16" x2="12" y2="12"/><line x1="12" y1="8" x2="12.01" y2="8"/></svg>
                        <span>系统内测中，功能与数据仍在调整，敬请留意</span>
                    </div>
                    <div class="home-layout">
                        <div class="calendar">
                            <div class="cal-head">
                                <span class="cal-title" id="calTitle"></span>
                                <div class="cal-nav">
                                    <button type="button" class="cal-today-btn" title="回到今天" data-act="cal-today">今天</button>
                                    <button type="button" class="icon-btn" title="上个月" data-act="cal-prev">
                                        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><polyline points="15 18 9 12 15 6"/></svg>
                                    </button>
                                    <button type="button" class="icon-btn" title="下个月" data-act="cal-next">
                                        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><polyline points="9 18 15 12 9 6"/></svg>
                                    </button>
                                </div>
                            </div>
                            <div class="cal-week"><span>一</span><span>二</span><span>三</span><span>四</span><span>五</span><span>六</span><span>日</span></div>
                            <div class="cal-grid" id="calGrid"></div>
                        </div>
                        <div class="home-right">
                            <div class="section-block mt-0">
                                <div class="section-head">
                                    <h2 class="section-title" id="noticeDateTitle">当前通知</h2>
                                    <button type="button" class="btn btn-outline btn-sm" data-view="notices">查看全部</button>
                                </div>
                                <div class="list" id="noticeList"></div>
                            </div>
                            <div class="section-block">
                                <div class="section-head">
                                    <h2 class="section-title" id="scheduleDateTitle">今日活动</h2>
                                    <button type="button" class="btn btn-outline btn-sm" data-view="activities">查看全部</button>
                                </div>
                                <div class="list" id="activityList"></div>
                            </div>
                            <div class="section-block">
                                <div class="section-head">
                                    <h2 class="section-title">我的表单</h2>
                                </div>
                                <div class="list" id="formList"></div>
                            </div>
                        </div>
                    </div>
                    </div>
                </div>

                <!-- 详情弹窗（点击"当日活动/当日通知"行弹出） -->
                <div class="modal-overlay" id="detailModal">
                    <div class="modal">
                        <div class="modal-head">
                            <span class="modal-title" id="detailModalTitle">活动详情</span>
                            <button type="button" class="modal-close" data-act="close-detail" aria-label="关闭">
                                <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><line x1="18" y1="6" x2="6" y2="18"/><line x1="6" y1="6" x2="18" y2="18"/></svg>
                            </button>
                        </div>
                        <div class="modal-body" id="detailCard"></div>
                    </div>
                </div>
            </div>

            <!-- 登录视图 -->
            <div class="app-view" id="loginView" hidden>
                <div class="login-wrap">
                    <div class="login-panel">
                        <div class="auth-brand">
                            <span class="brand-mark auth-mark">
                                <svg width="22" height="22" viewBox="0 0 24 24"><defs><mask id="caMarkKnockoutAuth" maskUnits="userSpaceOnUse" x="-256" y="-256" width="1024" height="1024"><rect x="-256" y="-256" width="1024" height="1024" fill="#fff"/><path d="M282,93 H390 A30,30 0 0 1 420,123 V175 A30,30 0 0 1 390,205 H338 L292,241 L304,205 H282 A30,30 0 0 1 252,175 V123 A30,30 0 0 1 282,93 Z" fill="#000" stroke="#000" stroke-width="36" stroke-linejoin="round" stroke-linecap="round"/><rect x="215" y="150" width="34" height="270" fill="#000"/></mask></defs><g transform="translate(-4.78 -3.73) scale(0.06555)"><g mask="url(#caMarkKnockoutAuth)" fill="#fff"><path d="M92,175 A172,172 0 0 1 232,208 L232,387 A172,172 0 0 0 92,354 Z"/><path d="M372,175 A172,172 0 0 0 232,208 L232,387 A172,172 0 0 1 372,354 Z"/></g><path d="M282,93 H390 A30,30 0 0 1 420,123 V175 A30,30 0 0 1 390,205 H338 L292,241 L304,205 H282 A30,30 0 0 1 252,175 V123 A30,30 0 0 1 282,93 Z" fill="#fff"/></g></svg>
                            </span>
                            <h1 class="auth-title">登录班级助理</h1>
                        </div>
                        <div class="form-error" id="loginError"></div>
                        <form id="loginForm" novalidate>
                            <div class="form-field">
                                <label class="form-label" for="loginStudentId">学号</label>
                                <input class="form-input" type="text" id="loginStudentId" placeholder="请输入学号" autocomplete="username">
                            </div>
                            <div class="form-field">
                                <label class="form-label" for="loginPassword">密码</label>
                                <input class="form-input" type="password" id="loginPassword" placeholder="请输入密码" autocomplete="current-password">
                            </div>
                            <button class="btn btn-primary btn-block" id="loginBtn" type="submit">登录</button>
                        </form>
                    </div>
                </div>
            </div>

            <!-- 各视图独立 iframe -->
            <iframe id="frameActivities" class="app-frame" data-loaded="0" hidden title="活动"></iframe>
            <iframe id="frameAcademic" class="app-frame" data-loaded="0" hidden title="学业"></iframe>
            <iframe id="frameNotices" class="app-frame" data-loaded="0" hidden title="通知"></iframe>
            <iframe id="frameAccount" class="app-frame" data-loaded="0" hidden title="个人中心"></iframe>
            <iframe id="frameAdmin" class="app-frame" data-loaded="0" hidden title="管理员面板"></iframe>
        </div>

        <!-- 移动端底部导航（小屏显示，替代侧边栏） -->
        <nav class="bottom-nav" id="bottomNav">
            <span class="bottom-nav-pill" id="bottomNavPill" aria-hidden="true"></span>
            <button type="button" class="bottom-nav-item active" data-nav="home" data-view="home">
                <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.75" stroke-linecap="round" stroke-linejoin="round"><path d="M3 9l9-7 9 7v11a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2z"/><polyline points="9 22 9 12 15 12 15 22"/></svg>
                <span>我的主页</span>
            </button>
            <button type="button" class="bottom-nav-item" data-nav="notices" data-view="notices">
                <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.75" stroke-linecap="round" stroke-linejoin="round"><path d="M14 2H6a2 2 0 0 0-2 2v16a2 2 0 0 0 2 2h12a2 2 0 0 0 2-2V8z"/><polyline points="14 2 14 8 20 8"/><line x1="16" y1="13" x2="8" y2="13"/><line x1="16" y1="17" x2="8" y2="17"/></svg>
                <span>班级通知</span>
            </button>
            <button type="button" class="bottom-nav-item" data-nav="activities" data-view="activities">
                <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.75" stroke-linecap="round" stroke-linejoin="round"><rect x="3" y="4" width="18" height="18" rx="2" ry="2"/><line x1="16" y1="2" x2="16" y2="6"/><line x1="8" y1="2" x2="8" y2="6"/><line x1="3" y1="10" x2="21" y2="10"/></svg>
                <span>班级活动</span>
            </button>
            <button type="button" class="bottom-nav-item" data-nav="academic" data-view="academic">
                <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.75" stroke-linecap="round" stroke-linejoin="round"><rect x="3" y="3" width="7" height="7" rx="1.5"/><rect x="14" y="3" width="7" height="7" rx="1.5"/><rect x="14" y="14" width="7" height="7" rx="1.5"/><rect x="3" y="14" width="7" height="7" rx="1.5"/></svg>
                <span>学业</span>
            </button>
            <button type="button" class="bottom-nav-item" data-nav="account" data-view="account">
                <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.75" stroke-linecap="round" stroke-linejoin="round"><path d="M20 21v-2a4 4 0 0 0-4-4H8a4 4 0 0 0-4 4v2"/><circle cx="12" cy="7" r="4"/></svg>
                <span>个人中心</span>
            </button>
        </nav>
    </div>

    <script src="assets/js/app.js"></script>
    <script src="assets/js/index.js"></script>
</body>
</html>
