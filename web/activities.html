<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
    <title>班级活动 - 班级助理</title>
    <meta name="description" content="班级助理：班级活动列表与详情。">
    <meta name="color-scheme" content="light dark">
    <meta name="theme-color" content="#f2f2f7" media="(prefers-color-scheme: light)">
    <meta name="theme-color" content="#07070c" media="(prefers-color-scheme: dark)">
    <link rel="icon" type="image/svg+xml" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='58 50 396 396'%3E%3Cdefs%3E%3Cmask id='ca-line-ko' maskUnits='userSpaceOnUse' x='-256' y='-256' width='1024' height='1024'%3E%3Crect x='-256' y='-256' width='1024' height='1024' fill='%23ffffff'/%3E%3Cpath d='M282,93 H390 A30,30 0 0 1 420,123 V175 A30,30 0 0 1 390,205 H338 L292,241 L304,205 H282 A30,30 0 0 1 252,175 V123 A30,30 0 0 1 282,93 Z' fill='%23000000' stroke='%23000000' stroke-width='36' stroke-linejoin='round' stroke-linecap='round'/%3E%3C/mask%3E%3C/defs%3E%3Cg mask='url(%23ca-line-ko)' fill='none' stroke='%23007aff' stroke-width='28' stroke-linecap='round' stroke-linejoin='round'%3E%3Cpath d='M92,175 A172,172 0 0 1 232,208 L232,387 A172,172 0 0 0 92,354 Z'/%3E%3Cpath d='M372,175 A172,172 0 0 0 232,208 L232,387 A172,172 0 0 1 372,354 Z'/%3E%3C/g%3E%3Cpath d='M282,93 H390 A30,30 0 0 1 420,123 V175 A30,30 0 0 1 390,205 H338 L292,241 L304,205 H282 A30,30 0 0 1 252,175 V123 A30,30 0 0 1 282,93 Z' fill='none' stroke='%23007aff' stroke-width='28' stroke-linejoin='round' stroke-linecap='round'/%3E%3C/svg%3E">
    <link rel="icon" type="image/png" sizes="192x192" href="assets/icons/icon-line-192.png">
    <link rel="icon" type="image/png" sizes="512x512" href="assets/icons/icon-line-512.png">
    <link rel="manifest" href="manifest.json">
    <link rel="apple-touch-icon" href="assets/icons/apple-touch-icon.png">
    <!-- iOS 加到主屏后独立运行（无地址栏）。状态栏用 default：iOS 会为状态栏预留空间，
         内容不被刘海/状态栏压住；不用 black-translucent —— 它固定白色状态栏文字，浅色主题下看不见。 -->
    <meta name="apple-mobile-web-app-capable" content="yes">
    <meta name="mobile-web-app-capable" content="yes">
    <meta name="apple-mobile-web-app-status-bar-style" content="default">
    <meta name="apple-mobile-web-app-title" content="班级助理">
    <link rel="stylesheet" href="assets/css/style.css">
    <script src="assets/js/theme.js"></script>
</head>
<body>
    <div class="main">
        <div class="container">
            <div id="listView">
                <div class="page-head">
                    <h1 class="page-title">班级活动</h1>
                    <p class="page-desc">班级活动的安排、地点与时间，按「正在进行 / 将要开始 / 已经结束」分类展示。</p>
                </div>

                <div id="activityListView"></div>
            </div>

            <!-- 详情弹窗 -->
            <div class="modal-overlay" id="detailModal">
                <div class="modal">
                    <div class="modal-head">
                        <span class="modal-title">活动详情</span>
                        <button type="button" class="modal-close" data-act="close-detail" aria-label="关闭">
                            <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><line x1="18" y1="6" x2="6" y2="18"/><line x1="6" y1="6" x2="18" y2="18"/></svg>
                        </button>
                    </div>
                    <div class="modal-body" id="detailCard"></div>
                </div>
            </div>

            <!-- 编辑弹窗 -->
            <div class="modal-overlay" id="editModal">
                <div class="modal">
                    <div class="modal-head">
                        <span class="modal-title">编辑活动</span>
                        <button type="button" class="modal-close" data-act="cancel-edit" aria-label="关闭">
                            <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><line x1="18" y1="6" x2="6" y2="18"/><line x1="6" y1="6" x2="18" y2="18"/></svg>
                        </button>
                    </div>
                    <div class="modal-body">
                        <div class="form-error" id="editError"></div>
                        <div class="form-field">
                            <label class="form-label">标题</label>
                            <input id="editTitle" class="form-input" type="text" placeholder="请输入活动标题" autocomplete="off">
                        </div>
                        <div class="form-field">
                            <label class="form-label">活动说明</label>
                            <textarea id="editContent" class="form-input" rows="3" placeholder="选填，可填写时间安排、参与方式等"></textarea>
                        </div>
                        <div class="form-field">
                            <label class="form-label">地点</label>
                            <input id="editLocation" class="form-input" type="text" placeholder="选填" autocomplete="off">
                        </div>
                        <div class="form-field">
                            <label class="form-label">开始时间</label>
                            <input id="editStart" class="form-input" type="datetime-local" autocomplete="off">
                        </div>
                        <div class="form-field">
                            <label class="form-label">结束时间</label>
                            <input id="editEnd" class="form-input" type="datetime-local" autocomplete="off">
                        </div>
                        <div class="form-field">
                            <label class="form-label">提醒对象（选填）</label>
                            <div id="editRemind" class="remind-box"></div>
                        </div>
                    </div>
                    <div class="modal-foot">
                        <button type="button" class="btn btn-outline" data-act="cancel-edit">取消</button>
                        <button type="button" class="btn btn-primary" id="editSubmitBtn">保存</button>
                    </div>
                </div>
            </div>
        </div>
    </div>

    <script src="assets/js/app.js"></script>
    <script src="assets/js/activities.js"></script>
</body>
</html>
