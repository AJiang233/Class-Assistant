<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>活动 - 班级助理</title>
    <meta name="description" content="班级助理：班级活动列表与详情。">
    <link rel="icon" type="image/svg+xml" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 64 64'%3E%3Crect width='64' height='64' rx='14' fill='%234f46e5'/%3E%3Cpath d='M16 24h32v18H26l-10 8z' fill='none' stroke='%23fff' stroke-width='3' stroke-linejoin='round'/%3E%3Cpath d='M24 30h16M24 34h10' stroke='%23fff' stroke-width='3' stroke-linecap='round'/%3E%3C/svg%3E">
    <link rel="stylesheet" href="assets/css/style.css">
    <script>
    /* 主题切换：localStorage('theme') 优先，其次跟随系统 prefers-color-scheme；同步写入 <html> 的 data-theme 防闪烁 */
    (function () {
        var KEY = 'theme';
        var root = document.documentElement;
        var mq = window.matchMedia('(prefers-color-scheme: dark)');
        function system() { return mq.matches ? 'dark' : 'light'; }
        function stored() { try { var v = localStorage.getItem(KEY); return (v === 'dark' || v === 'light') ? v : null; } catch (e) { return null; } }
        function apply(t) { root.setAttribute('data-theme', t); }
        function current() { return stored() || system(); }
        apply(current());
        function toggle() { var next = current() === 'dark' ? 'light' : 'dark'; apply(next); try { localStorage.setItem(KEY, next); } catch (e) {} }
        function bind() {
            var btn = document.getElementById('themeToggle');
            if (btn) btn.addEventListener('click', toggle);
            if (mq.addEventListener) mq.addEventListener('change', function (e) { if (!stored()) apply(e.matches ? 'dark' : 'light'); });
            else if (mq.addListener) mq.addListener(function (e) { if (!stored()) apply(e.matches ? 'dark' : 'light'); });
            window.addEventListener('storage', function (e) { if (e.key === KEY) apply(current()); });
        }
        if (document.readyState === 'loading') document.addEventListener('DOMContentLoaded', bind); else bind();
    })();
    </script>
</head>
<body>
    <div class="main">
        <div class="container">
            <!-- 列表视图 -->
            <div id="listView">
                <div class="page-head">
                    <h1 class="page-title">班级活动</h1>
                    <p class="page-desc">班级活动的安排、地点与时间，按开始时间倒序排列。</p>
                    <div id="publishToggle" style="display:none; margin-top:12px;">
                        <button type="button" class="btn btn-primary" onclick="togglePublish()" id="publishBtn">发布活动</button>
                    </div>
                </div>

                <!-- 发布表单（仅 content:write 权限者可见） -->
                <div class="profile-card" id="publishBox" style="display:none; margin-bottom:20px;">
                    <h3 id="pubBoxTitle" style="margin:0 0 12px; font-size:1.1rem;">发布活动</h3>
                    <div class="form-error" id="pubError"></div>
                    <div class="form-field">
                        <label class="form-label">标题</label>
                        <input id="pubTitle" class="form-input" type="text" placeholder="请输入活动标题" autocomplete="off">
                    </div>
                    <div class="form-field">
                        <label class="form-label">内容说明</label>
                        <textarea id="pubContent" class="form-input" rows="3" placeholder="选填"></textarea>
                    </div>
                    <div class="form-field">
                        <label class="form-label">地点</label>
                        <input id="pubLocation" class="form-input" type="text" placeholder="选填" autocomplete="off">
                    </div>
                    <div class="form-field">
                        <label class="form-label">开始时间</label>
                        <input id="pubStart" class="form-input" type="datetime-local" autocomplete="off">
                    </div>
                    <div class="form-field">
                        <label class="form-label">结束时间</label>
                        <input id="pubEnd" class="form-input" type="datetime-local" autocomplete="off">
                    </div>
                    <button type="button" class="btn btn-primary" id="pubSubmitBtn" onclick="submitActivity()">发布</button>
                    <button type="button" class="btn btn-outline" onclick="togglePublish()" style="margin-left:8px;">取消</button>
                </div>

                <div class="list" id="activityList"></div>
            </div>

            <!-- 详情视图 -->
            <div id="detailView" style="display:none;">
                <div style="margin-bottom:20px;">
                    <button type="button" class="btn btn-outline" onclick="backToList()">
                        <svg width="15" height="15" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" style="margin-right:2px;"><path d="M19 12H5"/><polyline points="12 19 5 12 12 5"/></svg>
                        返回列表
                    </button>
                </div>
                <div class="detail-card" id="detailCard"></div>
            </div>
        </div>
    </div>

    <script src="assets/js/app.js"></script>
    <script>
    (function () {
    // ===== 需要登录 =====
    if (!requireAuth()) return;

    var listView = document.getElementById('listView');
    var detailView = document.getElementById('detailView');

    // ===== 发布入口（仅 content:write 权限者可见） =====
    if (canContentWrite()) document.getElementById('publishToggle').style.display = 'block';

    var editingActivityId = null;

    function resetActivityForm() {
        editingActivityId = null;
        document.getElementById('pubBoxTitle').textContent = '发布活动';
        document.getElementById('pubSubmitBtn').textContent = '发布';
        document.getElementById('pubTitle').value = '';
        document.getElementById('pubContent').value = '';
        document.getElementById('pubLocation').value = '';
        document.getElementById('pubEnd').value = '';
    }

    function togglePublish() {
        var box = document.getElementById('publishBox');
        if (box.style.display === 'none') {
            resetActivityForm();
            box.style.display = 'block';
            document.getElementById('pubStart').value = nowLocal();
        } else {
            box.style.display = 'none';
            resetActivityForm();
        }
    }

    function nowLocal() {
        var d = new Date(); var pad = function (n) { return n < 10 ? '0' + n : '' + n; };
        return d.getFullYear() + '-' + pad(d.getMonth() + 1) + '-' + pad(d.getDate()) + 'T' + pad(d.getHours()) + ':' + pad(d.getMinutes());
    }

    async function submitActivity() {
        var errBox = document.getElementById('pubError');
        errBox.classList.remove('show');
        var title = document.getElementById('pubTitle').value.trim();
        var content = document.getElementById('pubContent').value.trim();
        var location = document.getElementById('pubLocation').value.trim();
        var start_time = document.getElementById('pubStart').value;
        var end_time = document.getElementById('pubEnd').value;
        if (!title || !start_time) {
            errBox.textContent = '标题、开始时间为必填';
            errBox.classList.add('show'); return;
        }
        var btn = document.getElementById('pubSubmitBtn');
        btn.disabled = true; var t = btn.textContent; btn.textContent = '提交中…';
        try {
            var body = { title: title, content: content, location: location, start_time: start_time, end_time: end_time };
            if (editingActivityId) {
                await api('/api/activities/' + editingActivityId, { method: 'PUT', body: JSON.stringify(body) });
            } else {
                await api('/api/activities', { method: 'POST', body: JSON.stringify(body) });
            }
            togglePublish();
            loadList();
        } catch (err) {
            errBox.textContent = err.message;
            errBox.classList.add('show');
        } finally {
            btn.disabled = false; btn.textContent = t;
        }
    }

    // ===== 加载列表 =====
    async function loadList() {
        var el = document.getElementById('activityList');
        el.innerHTML = skeletonHTML(5);
        try {
            var res = await api('/api/activities');
            var list = (res.data && res.data.list) || [];
            if (!list.length) { el.innerHTML = stateHTML('暂无活动'); return; }
            el.innerHTML = list.map(function (a) {
                var meta = '<span>' + esc(fmtDate(a.start_time)) + '</span>';
                if (a.location) meta += '<span>' + esc(a.location) + '</span>';
                if (a.publisher) meta += '<span>' + esc(a.publisher) + '</span>';
                return '<button type="button" class="list-row" onclick="showDetail(' + a.id + ')">'
                    + '<div class="list-row-main">'
                    + '<div class="list-row-title">' + esc(a.title) + '</div>'
                    + '<div class="list-row-meta">' + meta + '</div>'
                    + '</div>'
                    + '<svg class="list-row-arrow" width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><polyline points="9 18 15 12 9 6"/></svg>'
                    + '</button>';
            }).join('');
        } catch (err) {
            el.innerHTML = stateHTML(err.message, true);
        }
    }
    loadList();

    // ===== 查看详情 =====
    async function showDetail(id) {
        listView.style.display = 'none';
        detailView.style.display = 'block';
        var card = document.getElementById('detailCard');
        card.innerHTML = stateHTML('加载中…');
        try {
            var res = await api('/api/activities/' + id);
            var a = res.data;
            var meta = '<span>开始 ' + esc(fmtDate(a.start_time)) + '</span>';
            if (a.end_time) meta += '<span>结束 ' + esc(fmtDate(a.end_time)) + '</span>';
            if (a.location) meta += '<span>' + esc(a.location) + '</span>';
            meta += '<span>' + esc(a.publisher || '') + '</span>';
            var actBtns = canContentWrite()
                ? '<div style="margin-top:24px;">'
                  + '<button type="button" class="btn btn-outline" onclick="startEdit(' + a.id + ')" style="margin-right:8px;">编辑</button>'
                  + '<button type="button" class="btn btn-outline" style="color:#dc2626;border-color:#dc2626;" onclick="deleteActivity(' + a.id + ')">删除活动</button>'
                  + '</div>'
                : '';
            card.innerHTML =
                '<div class="detail-title">' + esc(a.title) + '</div>'
                + '<div class="detail-meta">' + meta + '</div>'
                + '<div class="detail-body">' + esc(a.content || '暂无活动说明') + '</div>'
                + actBtns;
            window.scrollTo({ top: 0 });
        } catch (err) {
            card.innerHTML = stateHTML(err.message, true);
        }
    }

    async function deleteActivity(id) {
        if (!confirm('确定删除该活动？')) return;
        try {
            await api('/api/activities/' + id, { method: 'DELETE' });
            backToList();
            loadList();
        } catch (err) {
            alert(err.message);
        }
    }

    function startEdit(id) {
        backToList();
        var box = document.getElementById('publishBox');
        if (box.style.display === 'none') { resetActivityForm(); box.style.display = 'block'; }
        api('/api/activities/' + id).then(function (res) {
            var a = res.data;
            document.getElementById('pubBoxTitle').textContent = '编辑活动';
            document.getElementById('pubSubmitBtn').textContent = '保存';
            document.getElementById('pubTitle').value = a.title || '';
            document.getElementById('pubContent').value = a.content || '';
            document.getElementById('pubLocation').value = a.location || '';
            document.getElementById('pubStart').value = (a.start_time || '').slice(0, 16);
            document.getElementById('pubEnd').value = (a.end_time || '').slice(0, 16);
            editingActivityId = id;
        }).catch(function (err) { alert(err.message); });
    }

    function backToList() {
        detailView.style.display = 'none';
        listView.style.display = 'block';
        window.scrollTo({ top: 0 });
    }

    function stateHTML(text, isError) {
        var cls = isError ? 'state error' : 'state';
        return '<div class="' + cls + '"><p>' + esc(text || '暂无数据') + '</p></div>';
    }
    // 供内联 onclick 调用
    window.showDetail = showDetail;
    window.togglePublish = togglePublish;
    window.submitActivity = submitActivity;
    window.deleteActivity = deleteActivity;
    window.startEdit = startEdit;
    window.backToList = backToList;
    })();
    </script>
</body>
</html>
