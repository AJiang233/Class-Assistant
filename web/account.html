<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
    <title>个人中心 - 班级助理</title>
    <meta name="description" content="班级助理：我的资料、个性化与修改密码。">
    <meta name="color-scheme" content="light dark">
    <meta name="theme-color" content="#f2f2f7" media="(prefers-color-scheme: light)">
    <meta name="theme-color" content="#07070c" media="(prefers-color-scheme: dark)">
    <link rel="icon" type="image/png" sizes="32x32" href="class-assistant-icon/assets/icon-32.png">
    <link rel="apple-touch-icon" sizes="180x180" href="class-assistant-icon/assets/icon-180.png">
    <link rel="stylesheet" href="assets/css/style.css">
    <script>
    /* 主题切换：localStorage('theme') 优先，其次跟随系统 prefers-color-scheme；同步写入 <html> 的 data-theme 防闪烁 */
    (function () {
        var KEY = 'theme';
        var root = document.documentElement;
        var mq = window.matchMedia('(prefers-color-scheme: dark)');
        function system() { return mq.matches ? 'dark' : 'light'; }
        function stored() { try { var v = localStorage.getItem(KEY); return (v === 'dark' || v === 'light') ? v : null; } catch (e) { return null; } }
        function apply(t) { root.setAttribute('data-theme', t); }
        function current() { return stored() || system(); }
        apply(current());
        function bind() {
            if (mq.addEventListener) mq.addEventListener('change', function (e) { if (!stored()) apply(e.matches ? 'dark' : 'light'); });
            else if (mq.addListener) mq.addListener(function (e) { if (!stored()) apply(e.matches ? 'dark' : 'light'); });
            window.addEventListener('storage', function (e) { if (e.key === KEY) apply(current()); });
        }
        if (document.readyState === 'loading') document.addEventListener('DOMContentLoaded', bind); else bind();
    })();
    </script>
</head>
<body>
    <div class="main">
        <div class="container">
            <div class="page-head">
                <h1 class="page-title">个人中心</h1>
                <p class="page-desc">查看自己的班级资料、调整外观偏好与修改密码。</p>
            </div>

            <div class="split-grid">
                <!-- 左列：个人资料 + 个性化 -->
                <div class="split-col">
                    <div class="profile-card" id="profileCard"></div>

                    <!-- 个性化（所有登录用户） -->
                    <div class="profile-card" id="prefCard">
                        <h2 style="margin:0 0 16px;">个性化</h2>
                        <div class="form-field" style="margin-bottom:0;">
                            <label class="form-label">主题外观</label>
                            <div class="tabs pref-seg" id="themeSeg">
                                <span class="tab-pill" id="themeSegPill" aria-hidden="true"></span>
                                <button type="button" class="tab" data-theme-choice="system">跟随系统</button>
                                <button type="button" class="tab" data-theme-choice="light">浅色</button>
                                <button type="button" class="tab" data-theme-choice="dark">深色</button>
                            </div>
                        </div>
                    </div>

                    <!-- 日历订阅（所有登录用户） -->
                    <div class="profile-card" id="calCard">
                        <h2 style="margin:0 0 8px;">日历订阅</h2>
                        <p class="profile-sub" style="margin:0 0 16px;">订阅后，班级日程会自动同步到手机系统日历（iOS / 安卓 / 鸿蒙通用，订阅后无需再打开本页）。下面的选项会写进订阅链接，改完重新复制即可。</p>
                        <div class="form-error" id="calError"></div>

                        <div style="display:grid; grid-template-columns:repeat(auto-fit, minmax(150px, 1fr)); gap:12px;">
                            <div class="form-field" style="margin-bottom:0;">
                                <label class="form-label" for="calRemind">提前提醒</label>
                                <select class="form-input" id="calRemind">
                                    <option value="0">不提醒</option>
                                    <option value="5">5 分钟</option>
                                    <option value="15">15 分钟</option>
                                    <option value="30" selected>30 分钟</option>
                                    <option value="60">1 小时</option>
                                    <option value="1440">1 天</option>
                                </select>
                            </div>
                            <div class="form-field" style="margin-bottom:0;">
                                <label class="form-label" for="calPast">包含过去</label>
                                <select class="form-input" id="calPast">
                                    <option value="0">不包含</option>
                                    <option value="7">最近 7 天</option>
                                    <option value="30" selected>最近 30 天</option>
                                    <option value="90">最近 90 天</option>
                                </select>
                            </div>
                            <div class="form-field" style="margin-bottom:0;">
                                <label class="form-label" for="calFuture">包含未来</label>
                                <select class="form-input" id="calFuture">
                                    <option value="30">1 个月</option>
                                    <option value="90">3 个月</option>
                                    <option value="180">6 个月</option>
                                    <option value="365" selected>1 年</option>
                                    <option value="730">2 年</option>
                                </select>
                            </div>
                        </div>

                        <label style="display:flex; align-items:center; gap:8px; margin:12px 0 14px; font-size:0.9rem; color:var(--text-secondary); cursor:pointer;">
                            <input type="checkbox" id="calNotices"> 把班级通知也加进日历（按发布当天全天显示）
                        </label>

                        <div class="form-field">
                            <label class="form-label" for="calUrl">订阅链接</label>
                            <input class="form-input" id="calUrl" type="text" readonly placeholder="正在获取订阅地址…">
                        </div>
                        <div class="btn-row">
                            <button class="btn btn-primary" id="calCopyBtn" type="button">复制链接</button>
                            <a class="btn btn-outline" id="calOpenBtn" href="#" rel="noopener">打开订阅</a>
                            <button class="btn btn-danger" id="calResetBtn" type="button">重置密钥</button>
                        </div>
                        <p class="profile-sub" style="margin:14px 0 0;">复制链接后，在手机日历里选择「添加订阅日历 / 从网址导入」粘贴即可；重置密钥会让旧链接立即失效（已订阅的设备需重新订阅）。</p>
                    </div>
                </div>

                <!-- 右列：管理员入口（仅手机端）+ 强制刷新 + 修改密码 + 退出登录 -->
                <div class="split-col">
                    <!-- 管理员面板入口（仅手机端；桌面端侧边栏已有该项） -->
                    <div class="profile-card only-mobile" id="adminEntryCard">
                        <h2 style="margin:0 0 8px;">管理员面板</h2>
                        <p class="profile-sub" style="margin:0 0 16px;">发布通知与活动、管理班级成员。</p>
                        <button class="btn btn-primary btn-block" type="button" onclick="openAdmin()">进入管理员面板</button>
                    </div>

                    <div class="profile-card">
                        <h2 style="margin:0 0 8px;">强制刷新</h2>
                        <p class="profile-sub" style="margin:0 0 16px;">页面样式错乱或显示异常时，清除本地缓存并重新加载整个应用。</p>
                        <button class="btn btn-outline btn-block" id="reloadBtn" type="button" onclick="forceRefresh()">清除缓存并刷新</button>
                    </div>

                    <div class="profile-card collapse" id="pwdCard">
                        <button type="button" class="collapse-head" onclick="toggleCollapse('pwdCard')" aria-expanded="false">
                            <h2>修改密码</h2>
                            <svg class="collapse-arrow" width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><polyline points="6 9 12 15 18 9"/></svg>
                        </button>
                        <div class="collapse-body">
                            <div class="form-error" id="pwdError"></div>
                            <form id="pwdForm" novalidate>
                                <div class="form-field">
                                    <label class="form-label" for="oldPassword">旧密码</label>
                                    <input class="form-input" type="password" id="oldPassword" placeholder="请输入旧密码" autocomplete="current-password">
                                </div>
                                <div class="form-field">
                                    <label class="form-label" for="newPassword">新密码</label>
                                    <input class="form-input" type="password" id="newPassword" placeholder="至少 6 位" autocomplete="new-password">
                                </div>
                                <div class="form-field">
                                    <label class="form-label" for="confirmPassword">确认新密码</label>
                                    <input class="form-input" type="password" id="confirmPassword" placeholder="再次输入新密码" autocomplete="new-password">
                                </div>
                                <button class="btn btn-primary btn-block" id="pwdBtn" type="submit">确认修改</button>
                            </form>
                        </div>
                    </div>

                    <div class="profile-card card-danger">
                        <h2 style="margin:0 0 8px;">退出登录</h2>
                        <p class="profile-sub" style="margin:0 0 16px;">退出后需重新输入学号与密码登录。</p>
                        <button class="btn btn-danger btn-block" onclick="window.parent.logout()">退出登录</button>
                    </div>
                </div>
            </div>
        </div>

        <!-- 修改联系方式弹窗 -->
        <div class="modal-overlay" id="contactModal">
            <div class="modal">
                <div class="modal-head">
                    <span class="modal-title">修改联系方式</span>
                    <button type="button" class="modal-close" onclick="closeContactEdit()" aria-label="关闭">
                        <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><line x1="18" y1="6" x2="6" y2="18"/><line x1="6" y1="6" x2="18" y2="18"/></svg>
                    </button>
                </div>
                <div class="modal-body">
                    <div class="form-error" id="contactError"></div>
                    <div class="form-field" style="margin-bottom:0;">
                        <label class="form-label" for="contactInput">联系方式</label>
                        <input class="form-input" id="contactInput" type="text" placeholder="如：微信号 / 手机号（选填，留空表示不填）" autocomplete="off">
                    </div>
                </div>
                <div class="modal-foot">
                    <button type="button" class="btn btn-outline" onclick="closeContactEdit()">取消</button>
                    <button type="button" class="btn btn-primary" id="contactSaveBtn" onclick="saveContact()">保存</button>
                </div>
            </div>
        </div>
    </div>

    <script src="assets/js/app.js"></script>
    <script>
    (function () {
    // ===== 需要登录 =====
    if (!requireAuth()) return;

    // ===== 卡片折叠（默认收起，点击标题行展开/收起） =====
    function toggleCollapse(id) {
        var card = document.getElementById(id);
        if (!card) return;
        var open = card.classList.toggle('open');
        var head = card.querySelector('.collapse-head');
        if (head) head.setAttribute('aria-expanded', open ? 'true' : 'false');
    }
    window.toggleCollapse = toggleCollapse;

    // ===== 管理员面板入口（仅手机端显示；无权限则直接移除该卡片） =====
    if (!(canManageUsers() || canContentWrite())) {
        var adminEntry = document.getElementById('adminEntryCard');
        if (adminEntry) adminEntry.remove();
    }
    function openAdmin() {
        try { window.parent.switchView('admin'); } catch (e) {}
    }
    window.openAdmin = openAdmin;

    // ===== 修改联系方式（本人可改自己的） =====
    function openContactEdit() {
        var err = document.getElementById('contactError');
        err.classList.remove('show');
        document.getElementById('contactInput').value = currentContact;
        document.getElementById('contactModal').classList.add('show');
        document.body.style.overflow = 'hidden';
    }
    function closeContactEdit() {
        document.getElementById('contactModal').classList.remove('show');
        document.body.style.overflow = '';
    }
    async function saveContact() {
        var err = document.getElementById('contactError');
        err.classList.remove('show');
        var value = document.getElementById('contactInput').value.trim();
        if (value.length > 60) {
            err.textContent = '联系方式最多 60 个字符';
            err.classList.add('show');
            return;
        }
        var btn = document.getElementById('contactSaveBtn');
        btn.disabled = true; var t = btn.textContent; btn.textContent = '保存中…';
        try {
            await api('/api/auth/profile', { method: 'PUT', body: JSON.stringify({ contact: value }) });
            // 同步本地会话缓存，避免其它页面读到旧的联系方式
            try {
                var u = getSession() || {};
                u.contact = value;
                localStorage.setItem(LS_USER, JSON.stringify(u));
            } catch (e) {}
            closeContactEdit();
            loadProfile();
        } catch (e) {
            err.textContent = e.message;
            err.classList.add('show');
        } finally {
            btn.disabled = false; btn.textContent = t;
        }
    }
    // 点遮罩 / 按 ESC 关闭；输入框回车即保存
    (function bindContactModal() {
        var overlay = document.getElementById('contactModal');
        overlay.addEventListener('click', function (e) { if (e.target === overlay) closeContactEdit(); });
        document.addEventListener('keydown', function (e) {
            if (e.key === 'Escape' && overlay.classList.contains('show')) closeContactEdit();
        });
        document.getElementById('contactInput').addEventListener('keydown', function (e) {
            if (e.key === 'Enter') { e.preventDefault(); saveContact(); }
        });
    })();
    window.openContactEdit = openContactEdit;
    window.closeContactEdit = closeContactEdit;
    window.saveContact = saveContact;

    // ===== 强制刷新：清除缓存后重载整个应用（用于修复布局/样式异常） =====
    async function forceRefresh() {
        var btn = document.getElementById('reloadBtn');
        if (btn) { btn.disabled = true; btn.textContent = '正在刷新…'; }
        // 清 Cache Storage（PWA / Service Worker 缓存）
        try {
            if (window.caches && caches.keys) {
                var keys = await caches.keys();
                await Promise.all(keys.map(function (k) { return caches.delete(k); }));
            }
        } catch (e) {}
        // 清会话缓存（保留 localStorage：登录态与主题设置）
        try { sessionStorage.clear(); } catch (e) {}
        // 重载顶层窗口，并加时间戳绕过 HTTP 缓存
        var target = window;
        try { if (window.top && window.top !== window) target = window.top; } catch (e) {}
        var next;
        try {
            var u = new URL(target.location.href);
            u.searchParams.set('_r', Date.now());
            next = u.toString();
        } catch (e) {
            var href = target.location.href.split('#')[0];
            next = href + (href.indexOf('?') >= 0 ? '&' : '?') + '_r=' + Date.now();
        }
        target.location.replace(next);
    }
    window.forceRefresh = forceRefresh;

    // ===== 加载我的资料 =====
    var currentContact = '';
    /** 更新时间：后端存的是 UTC（CURRENT_TIMESTAMP），展示时转为北京时间（+8） */
    function fmtUpdateTime(d) {
        if (!d) return '时间未知';
        var t = Date.parse(String(d).replace(' ', 'T') + 'Z');
        if (isNaN(t)) return d;
        var bj = new Date(t + 8 * 3600 * 1000);
        var p = function (n) { return (n < 10 ? '0' : '') + n; };
        return bj.getUTCFullYear() + '-' + p(bj.getUTCMonth() + 1) + '-' + p(bj.getUTCDate())
            + ' ' + p(bj.getUTCHours()) + ':' + p(bj.getUTCMinutes()) + ':' + p(bj.getUTCSeconds());
    }
    async function loadProfile() {
        var card = document.getElementById('profileCard');
        card.innerHTML = stateHTML('加载中…');
        try {
            var res = await api('/api/auth/me');
            var u = res.data;
            currentContact = u.contact || '';
            card.innerHTML =
                '<div class="profile-head">'
                + '<div class="profile-avatar">' + esc((u.name || '?').charAt(0)) + '</div>'
                + '<div>'
                + '<div class="profile-name">' + esc(u.name || '') + '</div>'
                + '<div class="profile-sub">学号 ' + esc(u.student_id || '') + '</div>'
                + '</div>'
                + '</div>'
                + '<div class="info-list">'
                + '<div class="info-row"><span class="k">职务</span><span class="v">' + positionsChipsHTML(u.positions) + '</span></div>'
                + '<div class="info-row"><span class="k">联系方式</span>'
                + '<span class="v" style="display:inline-flex;align-items:center;gap:10px;">'
                + '<span id="contactValue">' + esc(u.contact || '未填写') + '</span>'
                + '<button type="button" class="btn btn-outline btn-sm" onclick="openContactEdit()">修改</button>'
                + '</span></div>'
                + '<div class="info-row"><span class="k">更新时间</span><span class="v">' + esc(fmtUpdateTime(u.update_time)) + '</span></div>'
                + '</div>';
        } catch (err) {
            card.innerHTML = stateHTML(err.message, true);
        }
    }
    loadProfile();

    // ===== 个性化：主题外观 =====
    function currentThemeChoice() {
        try { var v = localStorage.getItem('theme'); return (v === 'dark' || v === 'light') ? v : 'system'; } catch (e) { return 'system'; }
    }
    function applyTheme(choice) {
        var resolved = choice === 'system'
            ? (window.matchMedia('(prefers-color-scheme: dark)').matches ? 'dark' : 'light')
            : choice;
        document.documentElement.setAttribute('data-theme', resolved);
        try {
            if (choice === 'system') localStorage.removeItem('theme');
            else localStorage.setItem('theme', choice);
        } catch (e) {}
        // 同步到应用壳（父窗口），保持一致
        try {
            if (window.parent && window.parent !== window && window.parent.document) {
                window.parent.document.documentElement.setAttribute('data-theme', resolved);
            }
        } catch (e) {}
    }
    function markThemeSeg() {
        var seg = document.getElementById('themeSeg');
        if (!seg) return;
        var cur = currentThemeChoice();
        var btns = seg.querySelectorAll('.tab');
        for (var i = 0; i < btns.length; i++) {
            btns[i].classList.toggle('active', btns[i].getAttribute('data-theme-choice') === cur);
        }
        moveThemeSegPill();
    }
    // 滑动滑块：与移动端底栏同款，位置与尺寸按激活项实测写入
    function moveThemeSegPill() {
        var pill = document.getElementById('themeSegPill');
        if (!pill) return;
        var active = pill.parentNode.querySelector('.tab.active');
        if (!active) { pill.style.opacity = '0'; return; }
        pill.style.left = active.offsetLeft + 'px';
        pill.style.top = active.offsetTop + 'px';
        pill.style.width = active.offsetWidth + 'px';
        pill.style.height = active.offsetHeight + 'px';
        pill.style.opacity = '1';
    }
    (function bindThemeSeg() {
        var seg = document.getElementById('themeSeg');
        if (!seg) return;
        seg.addEventListener('click', function (e) {
            var btn = e.target;
            while (btn && btn !== seg && !btn.getAttribute('data-theme-choice')) btn = btn.parentNode;
            if (!btn || btn === seg) return;
            applyTheme(btn.getAttribute('data-theme-choice'));
            markThemeSeg();
        });
        window.addEventListener('storage', function (e) { if (e.key === 'theme') markThemeSeg(); });
        markThemeSeg();
        // 首帧布局稳定后再定位一次；旋屏/尺寸变化时重算
        setTimeout(moveThemeSegPill, 0);
        window.addEventListener('resize', moveThemeSegPill);
    })();

    // ===== 修改密码 =====
    var pwdForm = document.getElementById('pwdForm');
    pwdForm.addEventListener('submit', async function (e) {
        e.preventDefault();
        var errBox = document.getElementById('pwdError');
        errBox.classList.remove('show');
        var old_password = document.getElementById('oldPassword').value;
        var new_password = document.getElementById('newPassword').value;
        var confirm = document.getElementById('confirmPassword').value;
        if (!old_password || !new_password || !confirm) { errBox.textContent = '请填写完整'; errBox.classList.add('show'); return; }
        if (new_password.length < 6) { errBox.textContent = '新密码长度至少 6 位'; errBox.classList.add('show'); return; }
        if (new_password !== confirm) { errBox.textContent = '两次输入的密码不一致'; errBox.classList.add('show'); return; }
        var btn = document.getElementById('pwdBtn');
        btn.disabled = true; var t = btn.textContent; btn.textContent = '提交中…';
        try {
            await api('/api/auth/change-password', { method: 'POST', body: JSON.stringify({ old_password: old_password, new_password: new_password }) });
            errBox.classList.add('show');
            errBox.textContent = '密码修改成功，请重新登录';
            setTimeout(function () { if (window.parent.logout) window.parent.logout(); else { clearSession(); } }, 1200);
        } catch (err) {
            errBox.textContent = err.message;
            errBox.classList.add('show');
        } finally {
            btn.disabled = false; btn.textContent = t;
        }
    });

    // ===== 日历订阅 =====
    var calUrlEl = document.getElementById('calUrl');
    var calOpenBtn = document.getElementById('calOpenBtn');
    var calCopyBtn = document.getElementById('calCopyBtn');
    var calResetBtn = document.getElementById('calResetBtn');
    var calBaseUrl = '';

    function calRefresh() {
        var url = '';
        if (calBaseUrl) {
            var u = new URL(calBaseUrl);
            var remind = document.getElementById('calRemind').value;
            var past = document.getElementById('calPast').value;
            var future = document.getElementById('calFuture').value;
            // 与服务端默认值相同的就不写进链接，保持简洁
            if (remind !== '30') u.searchParams.set('remind', remind);
            if (past !== '30') u.searchParams.set('past', past);
            if (future !== '365') u.searchParams.set('future', future);
            if (document.getElementById('calNotices').checked) u.searchParams.set('notices', '1');
            url = u.toString();
        }
        calUrlEl.value = url;
        calOpenBtn.href = url || '#';
    }

    ['calRemind', 'calPast', 'calFuture', 'calNotices'].forEach(function (id) {
        document.getElementById(id).addEventListener('change', calRefresh);
    });

    (async function loadCalendarToken() {
        try {
            var res = await api('/api/calendar/token');
            calBaseUrl = (res.data && res.data.url) || '';
            calRefresh();
        } catch (err) {
            var box = document.getElementById('calError');
            box.textContent = err.message || '获取订阅地址失败';
            box.classList.add('show');
        }
    })();

    calResetBtn.addEventListener('click', async function () {
        if (!window.confirm('重置后旧订阅链接立即失效，已订阅的日历需要重新订阅。确定重置？')) return;
        var errBox = document.getElementById('calError');
        errBox.classList.remove('show');
        var label = calResetBtn.textContent;
        calResetBtn.disabled = true;
        calResetBtn.textContent = '重置中…';
        try {
            var res = await api('/api/calendar/reset', { method: 'POST' });
            calBaseUrl = (res.data && res.data.url) || '';
            calRefresh();
        } catch (err) {
            errBox.textContent = err.message || '重置失败';
            errBox.classList.add('show');
        } finally {
            calResetBtn.disabled = false;
            calResetBtn.textContent = label;
        }
    });

    calCopyBtn.addEventListener('click', function () {
        if (!calUrlEl.value) return;
        function done() {
            calCopyBtn.textContent = '已复制';
            setTimeout(function () { calCopyBtn.textContent = '复制链接'; }, 1500);
        }
        if (navigator.clipboard && navigator.clipboard.writeText) {
            navigator.clipboard.writeText(calUrlEl.value).then(done, function () {
                calUrlEl.select();
                document.execCommand('copy');
                done();
            });
        } else {
            calUrlEl.select();
            document.execCommand('copy');
            done();
        }
    });
    })();
    </script>
</body>
</html>
