<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>通知 - 班级助理</title>
    <meta name="description" content="班级助理：班级通知列表与详情。">
    <link rel="icon" type="image/svg+xml" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 64 64'%3E%3Crect width='64' height='64' rx='14' fill='%23007aff'/%3E%3Cpath d='M16 24h32v18H26l-10 8z' fill='none' stroke='%23fff' stroke-width='3' stroke-linejoin='round'/%3E%3Cpath d='M24 30h16M24 34h10' stroke='%23fff' stroke-width='3' stroke-linecap='round'/%3E%3C/svg%3E">
    <link rel="stylesheet" href="assets/css/style.css">
    <script>
    /* 主题切换：localStorage('theme') 优先，其次跟随系统 prefers-color-scheme；同步写入 <html> 的 data-theme 防闪烁 */
    (function () {
        var KEY = 'theme';
        var root = document.documentElement;
        var mq = window.matchMedia('(prefers-color-scheme: dark)');
        function system() { return mq.matches ? 'dark' : 'light'; }
        function stored() { try { var v = localStorage.getItem(KEY); return (v === 'dark' || v === 'light') ? v : null; } catch (e) { return null; } }
        function apply(t) { root.setAttribute('data-theme', t); }
        function current() { return stored() || system(); }
        apply(current());
        function toggle() { var next = current() === 'dark' ? 'light' : 'dark'; apply(next); try { localStorage.setItem(KEY, next); } catch (e) {} }
        function bind() {
            var btn = document.getElementById('themeToggle');
            if (btn) btn.addEventListener('click', toggle);
            if (mq.addEventListener) mq.addEventListener('change', function (e) { if (!stored()) apply(e.matches ? 'dark' : 'light'); });
            else if (mq.addListener) mq.addListener(function (e) { if (!stored()) apply(e.matches ? 'dark' : 'light'); });
            window.addEventListener('storage', function (e) { if (e.key === KEY) apply(current()); });
        }
        if (document.readyState === 'loading') document.addEventListener('DOMContentLoaded', bind); else bind();
    })();
    </script>
</head>
<body>
    <div class="main">
        <div class="container">
            <!-- 列表视图 -->
            <div id="listView">
                <div class="page-head">
                    <h1 class="page-title">班级通知</h1>
                    <p class="page-desc">班委发布的班级通知，按发布时间倒序排列。</p>
                    <div id="publishToggle" style="display:none; margin-top:12px;">
                        <button type="button" class="btn btn-primary" onclick="togglePublish()" id="publishBtn">发布通知</button>
                    </div>
                    <div id="archiveToggle" style="display:none; margin-top:12px;">
                        <button type="button" class="btn btn-outline" onclick="toggleArchive()" id="archiveBtn">查看过期</button>
                    </div>
                </div>

                <!-- 发布表单（仅 content:write 权限者可见） -->
                <div class="profile-card" id="publishBox" style="display:none; margin-bottom:20px;">
                    <h3 id="pubBoxTitle" style="margin:0 0 12px; font-size:1.1rem;">发布通知</h3>
                    <div class="form-error" id="pubError"></div>
                    <div class="form-field">
                        <label class="form-label">标题</label>
                        <input id="pubTitle" class="form-input" type="text" placeholder="请输入通知标题" autocomplete="off">
                    </div>
                    <div class="form-field">
                        <label class="form-label">内容</label>
                        <textarea id="pubContent" class="form-input" rows="4" placeholder="请输入通知内容"></textarea>
                    </div>
                    <div class="form-field">
                        <label class="form-label">发布时间</label>
                        <input id="pubTime" class="form-input" type="datetime-local" autocomplete="off">
                    </div>
                    <div class="form-field">
                        <label class="form-label">存活至（选填，到期自动隐藏）</label>
                        <input id="pubExpire" class="form-input" type="datetime-local" autocomplete="off">
                    </div>
                    <div class="form-field">
                        <label class="form-label">提醒对象（选填）</label>
                        <div id="pubRemind" style="display:flex;flex-wrap:wrap;gap:8px;"></div>
                    </div>
                    <button type="button" class="btn btn-primary" id="pubSubmitBtn" onclick="submitNotice()">发布</button>
                    <button type="button" class="btn btn-outline" onclick="togglePublish()" style="margin-left:8px;">取消</button>
                </div>

                <div class="list" id="noticeList"></div>
            </div>

            <!-- 详情弹窗 -->
            <div class="modal-overlay" id="detailModal">
                <div class="modal">
                    <div class="modal-head">
                        <span class="modal-title">通知详情</span>
                        <button type="button" class="modal-close" onclick="closeDetail()" aria-label="关闭">
                            <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><line x1="18" y1="6" x2="6" y2="18"/><line x1="6" y1="6" x2="18" y2="18"/></svg>
                        </button>
                    </div>
                    <div class="modal-body" id="detailCard"></div>
                </div>
            </div>
        </div>
    </div>

    <script src="assets/js/app.js"></script>
    <script>
    (function () {
    // ===== 需要登录 =====
    if (!requireAuth()) return;

    var modalOverlay = document.getElementById('detailModal');

    // ===== 发布入口（仅 content:write 权限者可见） =====
    if (canContentWrite()) {
        document.getElementById('publishToggle').style.display = 'block';
        document.getElementById('archiveToggle').style.display = 'block';
        loadRemindChoices();
    }

    // ===== 提醒对象选择 =====
    var remindChoices = [];
    var isArchive = false;

    async function loadRemindChoices() {
        try {
            var res = await api('/api/auth/members-pick');
            remindChoices = (res.data && res.data.list) || [];
        } catch (e) {}
    }

    function renderRemindChoices(checkedNames) {
        var box = document.getElementById('pubRemind');
        if (!remindChoices.length) { box.innerHTML = '<span style="opacity:.6;font-size:.85rem;">暂无成员可提醒</span>'; return; }
        box.innerHTML = remindChoices.map(function (m) {
            var chk = (checkedNames && checkedNames.indexOf(m.name) >= 0) ? ' checked' : '';
            return '<label style="display:inline-flex;align-items:center;margin-right:12px;margin-bottom:6px;font-size:.9rem;"><input type="checkbox" class="remind-cb" value="' + esc(m.name) + '"' + chk + ' style="margin-right:4px;">' + esc(m.name) + '</label>';
        }).join('');
    }

    function collectRemind() {
        var names = [];
        document.querySelectorAll('#pubRemind .remind-cb:checked').forEach(function (el) { names.push(el.value); });
        return names;
    }

    function toggleArchive() {
        isArchive = !isArchive;
        document.getElementById('archiveBtn').textContent = isArchive ? '返回正常' : '查看过期';
        loadList();
    }

    var editingNoticeId = null;

    function resetNoticeForm() {
        editingNoticeId = null;
        document.getElementById('pubBoxTitle').textContent = '发布通知';
        document.getElementById('pubSubmitBtn').textContent = '发布';
        document.getElementById('pubTitle').value = '';
        document.getElementById('pubContent').value = '';
        document.getElementById('pubExpire').value = '';
        renderRemindChoices([]);
    }

    function togglePublish() {
        var box = document.getElementById('publishBox');
        if (box.style.display === 'none') {
            resetNoticeForm();
            box.style.display = 'block';
            document.getElementById('pubTime').value = nowLocal();
        } else {
            box.style.display = 'none';
            resetNoticeForm();
        }
    }

    async function submitNotice() {
        var errBox = document.getElementById('pubError');
        errBox.classList.remove('show');
        var title = document.getElementById('pubTitle').value.trim();
        var content = document.getElementById('pubContent').value.trim();
        var publish_time = document.getElementById('pubTime').value;
        var expire_time = document.getElementById('pubExpire').value || null;
        if (!title || !content || !publish_time) {
            errBox.textContent = '标题、内容、发布时间为必填';
            errBox.classList.add('show'); return;
        }
        var btn = document.getElementById('pubSubmitBtn');
        btn.disabled = true; var t = btn.textContent; btn.textContent = '提交中…';
        try {
            var body = { title: title, content: content, publish_time: publish_time, expire_time: expire_time, remind_people: collectRemind() };
            if (editingNoticeId) {
                await api('/api/notices/' + editingNoticeId, { method: 'PUT', body: JSON.stringify(body) });
            } else {
                await api('/api/notices', { method: 'POST', body: JSON.stringify(body) });
            }
            togglePublish();
            loadList();
        } catch (err) {
            errBox.textContent = err.message;
            errBox.classList.add('show');
        } finally {
            btn.disabled = false; btn.textContent = t;
        }
    }

    // ===== 加载列表 =====
    async function loadList() {
        var el = document.getElementById('noticeList');
        el.innerHTML = skeletonHTML(5);
        try {
            var res = await api(isArchive ? '/api/notices/archive' : '/api/notices');
            var list = (res.data && res.data.list) || [];
            if (!list.length) { el.innerHTML = stateHTML('暂无通知'); return; }
            el.innerHTML = list.map(function (n) {
                return '<button type="button" class="list-row" onclick="showDetail(' + n.id + ')">'
                    + '<div class="list-row-main">'
                    + '<div class="list-row-title">' + esc(n.title) + '</div>'
                    + '<div class="list-row-meta">'
                    + '<span class="badge badge-' + esc(n.source || 'manual') + '">' + esc(sourceName(n.source)) + '</span>'
                    + '<span>' + esc(n.publisher || '') + '</span>'
                    + '<span>' + esc(fmtDate(n.publish_time)) + '</span>'
                    + '</div>'
                    + '</div>'
                    + '<svg class="list-row-arrow" width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><polyline points="9 18 15 12 9 6"/></svg>'
                    + '</button>';
            }).join('');
        } catch (err) {
            el.innerHTML = stateHTML(err.message, true);
        }
    }
    loadList();

    // ===== 详情弹窗 =====
    function openDetail() {
        modalOverlay.classList.add('show');
        document.body.style.overflow = 'hidden';
    }
    function closeDetail() {
        modalOverlay.classList.remove('show');
        document.body.style.overflow = '';
    }
    // 点遮罩空白处关闭
    modalOverlay.addEventListener('click', function (e) {
        if (e.target === modalOverlay) closeDetail();
    });
    // ESC 关闭
    document.addEventListener('keydown', function (e) {
        if (e.key === 'Escape' && modalOverlay.classList.contains('show')) closeDetail();
    });

    async function showDetail(id) {
        var card = document.getElementById('detailCard');
        card.innerHTML = stateHTML('加载中…');
        openDetail();
        try {
            var res = await api('/api/notices/' + id);
            var n = res.data;
            var actBtns = canContentWrite()
                ? '<div class="modal-foot">'
                  + '<button type="button" class="btn btn-outline" onclick="startEdit(' + n.id + ')">编辑</button>'
                  + '<button type="button" class="btn btn-outline" style="color:#ff3b30;border-color:#ff3b30;" onclick="deleteNotice(' + n.id + ')">删除通知</button>'
                  + '</div>'
                : '';
            card.innerHTML =
                '<div class="detail-title">' + esc(n.title) + '</div>'
                + '<div class="detail-meta">'
                + '<span><svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M20 21v-2a4 4 0 0 0-4-4H8a4 4 0 0 0-4 4v2"/><circle cx="12" cy="7" r="4"/></svg>' + esc(n.publisher || '') + '</span>'
                + '<span><svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><circle cx="12" cy="12" r="10"/><polyline points="12 6 12 12 16 14"/></svg>' + esc(fmtDate(n.publish_time)) + '</span>'
                + '<span class="badge badge-' + esc(n.source || 'manual') + '">' + esc(sourceName(n.source)) + '</span>'
                + '</div>'
                + '<div class="detail-body">' + esc(n.content || '') + '</div>'
                + actBtns;
        } catch (err) {
            card.innerHTML = stateHTML(err.message, true);
        }
    }

    async function deleteNotice(id) {
        if (!confirm('确定删除该通知？')) return;
        try {
            await api('/api/notices/' + id, { method: 'DELETE' });
            closeDetail();
            loadList();
        } catch (err) {
            alert(err.message);
        }
    }

    function startEdit(id) {
        closeDetail();
        var box = document.getElementById('publishBox');
        if (box.style.display === 'none') { resetNoticeForm(); box.style.display = 'block'; }
        api('/api/notices/' + id).then(function (res) {
            var n = res.data;
            document.getElementById('pubBoxTitle').textContent = '编辑通知';
            document.getElementById('pubSubmitBtn').textContent = '保存';
            document.getElementById('pubTitle').value = n.title || '';
            document.getElementById('pubContent').value = n.content || '';
            document.getElementById('pubTime').value = (n.publish_time || '').replace(' ', 'T').slice(0, 16);
            document.getElementById('pubExpire').value = (n.expire_time || '').replace(' ', 'T').slice(0, 16);
            var names = [];
            if (n.remind_people) { try { var a = JSON.parse(n.remind_people); if (Array.isArray(a)) names = a; } catch (e) {} }
            renderRemindChoices(names);
            editingNoticeId = id;
        }).catch(function (err) { alert(err.message); });
    }

    // 供内联 onclick 调用
    window.showDetail = showDetail;
    window.togglePublish = togglePublish;
    window.toggleArchive = toggleArchive;
    window.submitNotice = submitNotice;
    window.deleteNotice = deleteNotice;
    window.startEdit = startEdit;
    window.closeDetail = closeDetail;
    })();
    </script>
</body>
</html>
