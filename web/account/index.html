<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
    <title>个人中心 - 班级助理</title>
    <meta name="description" content="班级助理：查看自己的班级资料，按分类进入资料、绑定、通知、外观与关于。">
    <meta name="color-scheme" content="light dark">
    <meta name="theme-color" content="#f2f2f7" media="(prefers-color-scheme: light)">
    <meta name="theme-color" content="#07070c" media="(prefers-color-scheme: dark)">
    <link rel="icon" type="image/png" sizes="192x192" href="../assets/icons/icon-192.png">
    <link rel="icon" type="image/png" sizes="512x512" href="../assets/icons/icon-512.png">
    <link rel="manifest" href="../manifest.json">
    <link rel="apple-touch-icon" href="../assets/icons/apple-touch-icon.png">
    <meta name="apple-mobile-web-app-capable" content="yes">
    <meta name="mobile-web-app-capable" content="yes">
    <meta name="apple-mobile-web-app-status-bar-style" content="default">
    <meta name="apple-mobile-web-app-title" content="班级助理">
    <link rel="stylesheet" href="../assets/css/style.css">
    <script src="../assets/js/theme.js"></script>
</head>
<body>
    <div class="main">
        <div class="container account-page">
            <div class="page-head">
                <h1 class="page-title">个人中心</h1>
                <p class="page-desc">查看自己的班级资料，按分类进入资料、绑定、通知、外观与关于。</p>
            </div>

                        <!-- 桌面端两列由 CSS 多栏自动均衡高度（卡片不跨列断开），先填满左列再折到右列；
                 手机上多栏退化成单列，顺序与这里一致。 -->
            <div class="card-columns">
                <div class="profile-card" id="profileCard"></div>

                <div class="profile-card" id="entryCard">
                        <h2 class="card-title">功能分类</h2>
                        <div class="info-list">
                            <a class="info-row account-entry" href="profile.html"><span class="k">账号与资料</span><span class="v">姓名 · 联系方式 · 邮箱 · 密码 ›</span></a>
                            <a class="info-row account-entry" href="binding.html"><span class="k">绑定与授权</span><span class="v">教务 · 学习通 · 中国大学MOOC ›</span></a>
                            <a class="info-row account-entry" href="notifications.html"><span class="k">通知与提醒</span><span class="v">网页通知 · App 提醒 · 日历订阅 ›</span></a>
                            <a class="info-row account-entry" href="preferences.html"><span class="k">外观与偏好</span><span class="v">跟随系统 · 浅色 · 深色 ›</span></a>
                            <a class="info-row account-entry" href="about.html"><span class="k">关于与支持</span><span class="v">版本 · 检查更新 · 法务 ›</span></a>
                        </div>
                    </div>

                <div class="profile-card only-mobile" id="adminEntryCard">
                        <h2 class="card-title">管理员面板</h2>
                        <p class="profile-sub profile-sub-wide">发布通知与活动、管理班级成员。</p>
                        <button class="btn btn-primary btn-block" type="button" data-act="open-admin">进入管理员面板</button>
                    </div>
            </div>

        </div>
    </div>

    <script src="../assets/js/app.js"></script>
    <script src="../assets/js/account/core.js"></script>
    <script src="../assets/js/account/overview.js"></script>
</body>
</html>
