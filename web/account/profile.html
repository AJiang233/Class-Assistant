<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
    <title>账号与资料 - 班级助理</title>
    <meta name="description" content="班级助理：姓名、联系方式、邮箱与订阅、修改密码、退出登录。">
    <meta name="color-scheme" content="light dark">
    <meta name="theme-color" content="#f2f2f7" media="(prefers-color-scheme: light)">
    <meta name="theme-color" content="#07070c" media="(prefers-color-scheme: dark)">
    <link rel="icon" type="image/png" sizes="192x192" href="../assets/icons/icon-192.png">
    <link rel="icon" type="image/png" sizes="512x512" href="../assets/icons/icon-512.png">
    <link rel="manifest" href="../manifest.json">
    <link rel="apple-touch-icon" href="../assets/icons/apple-touch-icon.png">
    <meta name="apple-mobile-web-app-capable" content="yes">
    <meta name="mobile-web-app-capable" content="yes">
    <meta name="apple-mobile-web-app-status-bar-style" content="default">
    <meta name="apple-mobile-web-app-title" content="班级助理">
    <link rel="stylesheet" href="../assets/css/style.css">
    <script src="../assets/js/theme.js"></script>
</head>
<body>
    <div class="main">
        <div class="container account-page">
            <div class="page-head">
                <a class="legal-back account-back" href="./">← 个人中心</a>
                <h1 class="page-title">账号与资料</h1>
                <p class="page-desc">姓名、联系方式、邮箱与订阅、修改密码、退出登录。</p>
            </div>

                                    <!-- 桌面端两列由 CSS 多栏自动均衡高度（卡片不跨列断开），先填满左列再折到右列；
                 手机上多栏退化成单列，顺序与这里一致。 -->
            <div class="card-columns">
<div class="profile-card" id="profileCard"></div>

<div class="profile-card" id="pwdCard">
                        <h2 class="card-title">修改密码</h2>
                        <div class="form-error" id="pwdError"></div>
                        <form id="pwdForm" novalidate>
                            <div class="form-field">
                                <label class="form-label" for="oldPassword">旧密码</label>
                                <input class="form-input" type="password" id="oldPassword" placeholder="请输入旧密码" autocomplete="current-password">
                            </div>
                            <div class="form-field">
                                <label class="form-label" for="newPassword">新密码</label>
                                <input class="form-input" type="password" id="newPassword" placeholder="至少 6 位" autocomplete="new-password">
                            </div>
                            <div class="form-field">
                                <label class="form-label" for="confirmPassword">确认新密码</label>
                                <input class="form-input" type="password" id="confirmPassword" placeholder="再次输入新密码" autocomplete="new-password">
                            </div>
                            <button class="btn btn-primary btn-block" id="pwdBtn" type="submit">保存</button>
                        </form>
                    </div>

<div class="profile-card card-danger">
                        <h2 class="card-title">退出登录</h2>
                        <p class="profile-sub profile-sub-wide">退出后需重新输入学号与密码登录。</p>
                        <button class="btn btn-danger btn-block" data-act="logout">退出登录</button>
                    </div>
            </div>

        <!-- 修改联系方式弹窗 -->
        <div class="modal-overlay" id="contactModal">
            <div class="modal">
                <div class="modal-head">
                    <span class="modal-title">修改联系方式</span>
                    <button type="button" class="modal-close" data-act="close-contact-edit" aria-label="关闭">
                        <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><line x1="18" y1="6" x2="6" y2="18"/><line x1="6" y1="6" x2="18" y2="18"/></svg>
                    </button>
                </div>
                <div class="modal-body">
                    <div class="form-error" id="contactError"></div>
                    <div class="form-field mb-0">
                        <label class="form-label" for="contactInput">联系方式</label>
                        <input class="form-input" id="contactInput" type="text" placeholder="手机号（选填，留空表示不填）" autocomplete="off">
                    </div>
                </div>
                <div class="modal-foot">
                    <button type="button" class="btn btn-outline" data-act="close-contact-edit">取消</button>
                    <button type="button" class="btn btn-primary" id="contactSaveBtn" data-act="save-contact">保存</button>
                </div>
            </div>
        </div>

        <!-- 邮箱弹窗：邮箱的绑定 / 更换 / 解绑全在这里做，资料卡那一行只显示邮箱与一个「管理」，
             验证状态徽章在这个弹窗的标题后。
             发码那一刻后端就把邮箱记成「已填未验证」，只有点「保存」（＝验码通过）才置为已验证。 -->

        <div class="modal-overlay" id="emailModal">
            <div class="modal">
                <div class="modal-head">
                    <div class="modal-title-wrap">
                        <span class="modal-title">邮箱管理</span>
                        <!-- 验证状态徽章在这里（已验证 / 未验证），资料卡那行不再重复放徽章 -->
                        <span class="badge badge-ok" id="emailTitleBadge" hidden></span>
                    </div>
                    <button type="button" class="modal-close" data-act="close-email-edit" aria-label="关闭">
                        <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><line x1="18" y1="6" x2="6" y2="18"/><line x1="6" y1="6" x2="18" y2="18"/></svg>
                    </button>
                </div>
                <div class="modal-body">
                    <div class="form-error" id="emailError"></div>
                    <div class="form-field">
                        <label class="form-label" for="emailInput">邮箱（填QQ邮箱有头像~）</label>
                        <input class="form-input" id="emailInput" type="email" placeholder="如：zhangsan@qq.com" autocomplete="email">
                    </div>
                    <div id="emailCodeSection">
                        <div class="form-field mb-0">
                            <label class="form-label" for="emailCodeInput">验证码</label>
                            <div class="fld-row">
                                <input class="form-input" id="emailCodeInput" type="text" inputmode="numeric" maxlength="6" placeholder="6 位数字" autocomplete="one-time-code">
                                <button class="btn btn-outline" type="button" id="emailSendCodeBtn" data-act="send-email-code">发送验证码</button>
                            </div>
                        </div>
                        <p class="auth-note">验证码 10 分钟内有效。收不到就看看垃圾邮件；同一个邮箱 1 分钟内只能发一次。</p>
                    </div>
                    <!-- 解绑只在「已绑且已验证」时出现（JS 控制 hidden）：邮箱是找回密码的凭据，
                         解绑等于把那条路关掉，所以放在弹窗里并要一次确认，不在资料卡上直接给按钮 -->
                    <div id="emailUnbindRow" hidden>
                        <button type="button" class="btn btn-outline btn-block" data-act="unbind-email">解绑邮箱</button>
                    </div>
                    <!-- 订阅通知：只有邮箱已验证才显示（JS 控制 hidden）。「全部订阅」与三项分订阅联动：
                         勾全部＝三项全勾；取消任一分项＝「全部订阅」跟着取消（没全勾就不算全部）。
                         解绑邮箱后订阅清零、这一整块跟着隐藏。 -->
                    <div class="card-divider" id="emailSubSection" hidden>
                        <label class="switch-row">
                            <span>全部订阅</span>
                            <span class="switch">
                                <input type="checkbox" id="subAll" data-act="toggle-sub-all">
                                <span class="switch-track" aria-hidden="true"></span>
                            </span>
                        </label>
                        <div class="sub-list">
                            <label class="switch-row">
                                <span>活动订阅</span>
                                <span class="switch">
                                    <input type="checkbox" id="subActivities" data-act="toggle-sub-one" data-kind="activities">
                                    <span class="switch-track" aria-hidden="true"></span>
                                </span>
                            </label>
                            <label class="switch-row">
                                <span>通知订阅</span>
                                <span class="switch">
                                    <input type="checkbox" id="subNotices" data-act="toggle-sub-one" data-kind="notices">
                                    <span class="switch-track" aria-hidden="true"></span>
                                </span>
                            </label>
                            <label class="switch-row">
                                <span>表单订阅</span>
                                <span class="switch">
                                    <input type="checkbox" id="subForms" data-act="toggle-sub-one" data-kind="forms">
                                    <span class="switch-track" aria-hidden="true"></span>
                                </span>
                            </label>
                        </div>
                        <!-- 订阅开关只改本地状态，点下方「保存」才写后端（避免每拨一下都发一次请求）——
                             这个保存按钮与邮箱验证是同一个：未验证时＝验码完成绑定，已验证时＝保存订阅 -->
                        <p class="profile-sub profile-sub-tail">开启后，新的活动 / 通知 / 待填表单会同步发到你的邮箱；改动点下方「保存」生效。</p>
                    </div>
                </div>
                <div class="modal-foot">
                    <button type="button" class="btn btn-outline" data-act="close-email-edit">取消</button>
                    <button type="button" class="btn btn-primary" id="emailSaveBtn" data-act="save-email">保存</button>
                </div>
            </div>
        </div>

        <!-- 用户协议与授权：显示协议版本与最近同意时间；《用户协议》固定已同意、只能看全文，
             学习通 / 教务 / 中国大学MOOC 三项可选授权可以随时开关，点「保存」写后端（account.js 的 saveConsent）。 -->

        </div>
    </div>

    <script src="../assets/js/app.js"></script>
    <script src="../assets/js/account/core.js"></script>
    <script src="../assets/js/account/profile.js"></script>
</body>
</html>
