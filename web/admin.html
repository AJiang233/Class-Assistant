<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
    <title>管理员面板 - 班级助理</title>
    <meta name="description" content="班级助理：管理员功能，发布活动、通知与管理班级成员。">
    <meta name="color-scheme" content="light dark">
    <meta name="theme-color" content="#f2f2f7" media="(prefers-color-scheme: light)">
    <meta name="theme-color" content="#07070c" media="(prefers-color-scheme: dark)">
    <link rel="icon" type="image/svg+xml" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='58 50 396 396'%3E%3Cdefs%3E%3Cmask id='ca-line-ko' maskUnits='userSpaceOnUse' x='-256' y='-256' width='1024' height='1024'%3E%3Crect x='-256' y='-256' width='1024' height='1024' fill='%23ffffff'/%3E%3Cpath d='M282,93 H390 A30,30 0 0 1 420,123 V175 A30,30 0 0 1 390,205 H338 L292,241 L304,205 H282 A30,30 0 0 1 252,175 V123 A30,30 0 0 1 282,93 Z' fill='%23000000' stroke='%23000000' stroke-width='36' stroke-linejoin='round' stroke-linecap='round'/%3E%3C/mask%3E%3C/defs%3E%3Cg mask='url(%23ca-line-ko)' fill='none' stroke='%23007aff' stroke-width='28' stroke-linecap='round' stroke-linejoin='round'%3E%3Cpath d='M92,175 A172,172 0 0 1 232,208 L232,387 A172,172 0 0 0 92,354 Z'/%3E%3Cpath d='M372,175 A172,172 0 0 0 232,208 L232,387 A172,172 0 0 1 372,354 Z'/%3E%3C/g%3E%3Cpath d='M282,93 H390 A30,30 0 0 1 420,123 V175 A30,30 0 0 1 390,205 H338 L292,241 L304,205 H282 A30,30 0 0 1 252,175 V123 A30,30 0 0 1 282,93 Z' fill='none' stroke='%23007aff' stroke-width='28' stroke-linejoin='round' stroke-linecap='round'/%3E%3C/svg%3E">
    <link rel="icon" type="image/png" sizes="192x192" href="assets/icons/icon-line-192.png">
    <link rel="icon" type="image/png" sizes="512x512" href="assets/icons/icon-line-512.png">
    <link rel="manifest" href="manifest.json">
    <link rel="apple-touch-icon" href="assets/icons/apple-touch-icon.png">
    <!-- iOS 加到主屏后独立运行（无地址栏）。状态栏用 default：iOS 会为状态栏预留空间，
         内容不被刘海/状态栏压住；不用 black-translucent —— 它固定白色状态栏文字，浅色主题下看不见。 -->
    <meta name="apple-mobile-web-app-capable" content="yes">
    <meta name="mobile-web-app-capable" content="yes">
    <meta name="apple-mobile-web-app-status-bar-style" content="default">
    <meta name="apple-mobile-web-app-title" content="班级助理">
    <link rel="stylesheet" href="assets/css/style.css">
    <script src="assets/js/theme.js"></script>
</head>
<body>
    <div class="main">
        <div class="container">
            <div class="page-head">
                <h1 class="page-title">管理员面板</h1>
                <p class="page-desc">发布班级通知、活动，并管理班级成员。</p>
            </div>

            <div class="split-grid">
                <!-- ============ 左列：添加 ============ -->
                <div class="split-col">

                    <!-- 添加通知 -->
                    <div class="profile-card collapse" id="addNoticeCard" hidden>
                        <button type="button" class="collapse-head" data-act="toggle-collapse" data-arg="addNoticeCard" aria-expanded="false">
                            <h2>添加通知</h2>
                            <svg class="collapse-arrow" width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><polyline points="6 9 12 15 18 9"/></svg>
                        </button>
                        <div class="collapse-body">
                            <div class="form-error" id="ntcError"></div>
                            <div class="form-field">
                                <label class="form-label">标题</label>
                                <input id="ntcTitle" class="form-input" type="text" placeholder="请输入通知标题" autocomplete="off">
                            </div>
                            <div class="form-field">
                                <label class="form-label">通知内容</label>
                                <textarea id="ntcContent" class="form-input" rows="4" placeholder="请输入通知内容"></textarea>
                            </div>
                            <div class="form-field">
                                <label class="form-label">发布时间</label>
                                <input id="ntcPublish" class="form-input" type="datetime-local" autocomplete="off">
                            </div>
                            <div class="form-field">
                                <label class="form-label">截止时间（未填写则长期通知）</label>
                                <input id="ntcExpire" class="form-input" type="datetime-local" data-empty-hint="未填写（长期有效）" autocomplete="off">
                            </div>
                            <div class="form-field">
                                <label class="form-label">提醒对象（未勾选则全班，不含「不计入班级管理」的职位）</label>
                                <div id="ntcRemind" class="remind-box"></div>
                            </div>
                            <button type="button" class="btn btn-primary btn-block" id="ntcSubmitBtn" data-act="submit-notice">发布通知</button>
                        </div>
                    </div>

                    <!-- 添加活动 -->
                    <div class="profile-card collapse" id="addActivityCard" hidden>
                        <button type="button" class="collapse-head" data-act="toggle-collapse" data-arg="addActivityCard" aria-expanded="false">
                            <h2>添加活动</h2>
                            <svg class="collapse-arrow" width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><polyline points="6 9 12 15 18 9"/></svg>
                        </button>
                        <div class="collapse-body">
                            <div class="form-error" id="actError"></div>
                            <div class="form-field">
                                <label class="form-label">标题</label>
                                <input id="actTitle" class="form-input" type="text" placeholder="请输入活动标题" autocomplete="off">
                            </div>
                            <div class="form-field">
                                <label class="form-label">活动说明</label>
                                <textarea id="actContent" class="form-input" rows="3" placeholder="选填，可填写时间安排、参与方式等"></textarea>
                            </div>
                            <div class="form-field">
                                <label class="form-label">活动地点</label>
                                <input id="actLocation" class="form-input" type="text" placeholder="选填" autocomplete="off">
                            </div>
                            <div class="form-field">
                                <label class="form-label">开始时间</label>
                                <input id="actStart" class="form-input" type="datetime-local" autocomplete="off">
                            </div>
                            <div class="form-field">
                                <label class="form-label">结束时间（未填写则仅当天有效）</label>
                                <input id="actEnd" class="form-input" type="datetime-local" data-empty-hint="未填写（仅当天）" autocomplete="off">
                            </div>
                            <div class="form-field">
                                <label class="form-label">提醒对象（未勾选则全班，不含「不计入班级管理」的职位）</label>
                                <div id="actRemind" class="remind-box"></div>
                            </div>
                            <button type="button" class="btn btn-primary btn-block" id="actSubmitBtn" data-act="submit-activity">发布活动</button>
                        </div>
                    </div>

                    <!-- 添加表单 -->
                    <div class="profile-card collapse" id="addFormCard" hidden>
                        <button type="button" class="collapse-head" data-act="toggle-collapse" data-arg="addFormCard" aria-expanded="false">
                            <h2>添加表单</h2>
                            <svg class="collapse-arrow" width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><polyline points="6 9 12 15 18 9"/></svg>
                        </button>
                        <div class="collapse-body">
                            <div class="form-error" id="fcError"></div>
                            <div class="form-field">
                                <label class="form-label" for="fcTitle">表单标题</label>
                                <input id="fcTitle" class="form-input" type="text" placeholder="如：国庆聚餐报名" autocomplete="off">
                            </div>
                            <div class="form-field">
                                <label class="form-label" for="fcDesc">说明（选填）</label>
                                <textarea id="fcDesc" class="form-input" rows="2" placeholder="填写须知"></textarea>
                            </div>
                            <div class="form-field">
                                <label class="form-label" for="fcDeadline">截止时间（选填，到期自动停止提交）</label>
                                <input id="fcDeadline" class="form-input" type="datetime-local" data-empty-hint="未填写（长期开放）" autocomplete="off">
                            </div>
                            <div class="form-field">
                                <label class="form-label" for="fcEditPolicy">允许修改</label>
                                <select id="fcEditPolicy" class="form-input">
                                    <option value="before_deadline">截止前可修改</option>
                                    <option value="none">提交后不可修改</option>
                                    <option value="always">随时可修改</option>
                                </select>
                            </div>
                            <div class="form-field">
                                <label class="field-check"><input type="checkbox" id="fcAnonymous"> 匿名提交（只记录谁已交，不记录谁答了什么）</label>
                            </div>
                            <div class="form-field">
                                <label class="form-label">字段</label>
                                <div id="fcFields"></div>
                                <button type="button" class="btn btn-outline btn-block mt-8" data-act="add-field-row">添加字段</button>
                            </div>
                            <div class="form-field">
                                <label class="form-label">提交对象（未勾选则全班，用于算未交名单；不含「不计入班级管理」的职位）</label>
                                <div id="fcRemind" class="remind-box"></div>
                            </div>
                            <div class="form-field">
                                <label class="field-check"><input type="checkbox" id="fcNotice"> 同时下发一条通知（带「去填写」按钮）</label>
                                <input id="fcNoticeContent" class="form-input mt-6" type="text" placeholder="通知内容（选填）" autocomplete="off">
                            </div>
                            <button type="button" class="btn btn-primary btn-block" id="fcSubmitBtn" data-act="submit-form-create">添加表单</button>
                        </div>
                    </div>

                    <!-- 管理表单 -->
                    <div class="profile-card collapse" id="manageFormsCard" hidden>
                        <button type="button" class="collapse-head" data-act="toggle-collapse" data-arg="manageFormsCard" aria-expanded="false">
                            <h2>管理表单</h2>
                            <svg class="collapse-arrow" width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><polyline points="6 9 12 15 18 9"/></svg>
                        </button>
                        <div class="collapse-body">
                            <div class="info-list" id="formAdminList"></div>
                        </div>
                    </div>
                </div>

                <!-- ============ 右列：成员 / 职位 ============ -->
                <div class="split-col">

                    <!-- 管理成员 -->
                    <div class="profile-card collapse" id="membersCard" hidden>
                        <button type="button" class="collapse-head" data-act="toggle-collapse" data-arg="membersCard" aria-expanded="false">
                            <h2>管理成员</h2>
                            <svg class="collapse-arrow" width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><polyline points="6 9 12 15 18 9"/></svg>
                        </button>
                        <div class="collapse-body">
                            <div class="form-field">
                                <input id="memberSearch" class="form-input" type="search" placeholder="搜索姓名 / 学号 / 职位" autocomplete="off" data-act="filter-members">
                            </div>
                            <div class="info-list" id="memberList"></div>
                        </div>
                    </div>

                    <!-- 添加成员 -->
                    <div class="profile-card collapse" id="addMemberCard" hidden>
                        <button type="button" class="collapse-head" data-act="toggle-collapse" data-arg="addMemberCard" aria-expanded="false">
                            <h2>添加成员</h2>
                            <svg class="collapse-arrow" width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><polyline points="6 9 12 15 18 9"/></svg>
                        </button>
                        <div class="collapse-body">
                            <div class="form-error" id="regError"></div>
                            <form id="regForm" novalidate>
                                <div class="form-field">
                                    <label class="form-label" for="regStudentId">学号</label>
                                    <input class="form-input" type="text" id="regStudentId" placeholder="请输入学号" autocomplete="off">
                                </div>
                                <div class="form-field">
                                    <label class="form-label" for="regName">姓名</label>
                                    <input class="form-input" type="text" id="regName" placeholder="请输入姓名" autocomplete="off">
                                </div>
                                <div class="form-field">
                                    <label class="form-label" for="regPassword">初始密码</label>
                                    <input class="form-input" type="password" id="regPassword" placeholder="至少 6 位" autocomplete="new-password">
                                </div>
                                <div class="form-field">
                                    <label class="form-label" for="regContact">联系方式</label>
                                    <input class="form-input" type="text" id="regContact" placeholder="选填" autocomplete="off">
                                </div>
                                <div class="form-field">
                                    <label class="form-label">职位（可多选，留空则为「学生」）</label>
                                    <div class="pos-picker" id="regPosPicker"></div>
                                </div>
                                <button class="btn btn-primary btn-block" id="regBtn" type="submit">添加成员</button>
                            </form>
                        </div>
                    </div>

                    <!-- 管理职位 -->
                    <div class="profile-card collapse" id="manageRolesCard" hidden>
                        <button type="button" class="collapse-head" data-act="toggle-collapse" data-arg="manageRolesCard" aria-expanded="false">
                            <h2>管理职位</h2>
                            <svg class="collapse-arrow" width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><polyline points="6 9 12 15 18 9"/></svg>
                        </button>
                        <div class="collapse-body">
                            <div class="info-list" id="roleList"></div>
                        </div>
                    </div>

                    <!-- 添加职位 -->
                    <div class="profile-card collapse" id="addRoleCard" hidden>
                        <button type="button" class="collapse-head" data-act="toggle-collapse" data-arg="addRoleCard" aria-expanded="false">
                            <h2>添加职位</h2>
                            <svg class="collapse-arrow" width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><polyline points="6 9 12 15 18 9"/></svg>
                        </button>
                        <div class="collapse-body">
                            <div class="form-error" id="roleError"></div>
                            <div class="form-field">
                                <label class="form-label" for="roleName">职位名称</label>
                                <input id="roleName" class="form-input" type="text" placeholder="如：团员、文艺委员" autocomplete="off">
                            </div>
                            <div class="form-field">
                                <label class="form-label">该职位的权限（可选，不勾选则仅为称号）</label>
                                <label class="field-check"><input type="checkbox" id="rolePermWrite" value="content:write"> 可发布、修改、删除活动与通知，创建、管理表单</label>
                                <label class="field-check"><input type="checkbox" id="rolePermManage" value="user:manage"> 可注册账号、管理班级成员、添加、管理职位</label>
                                <label class="field-check"><input type="checkbox" id="rolePermExclude" value="class:exclude"> 不计入班级管理（提醒对象为空时不算全班，需在提醒对象里明确勾选才通知）</label>
                            </div>
                            <button type="button" class="btn btn-primary btn-block" id="roleAddBtn" data-act="add-role">添加职位</button>
                        </div>
                    </div>
                </div>
            </div>
        </div>

        <!-- ============ 编辑弹窗 ============ -->
        <!-- 编辑成员 -->
        <div class="modal-overlay" id="editMemberModal">
            <div class="modal">
                <div class="modal-head">
                    <span class="modal-title" id="editMemberTitle">编辑成员</span>
                    <button type="button" class="modal-close" data-act="cancel-edit-member" aria-label="关闭">
                        <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><line x1="18" y1="6" x2="6" y2="18"/><line x1="6" y1="6" x2="18" y2="18"/></svg>
                    </button>
                </div>
                <div class="modal-body">
                    <div class="form-error" id="editMemberError"></div>
                    <div class="form-field">
                        <label class="form-label">姓名</label>
                        <input id="editName" class="form-input" type="text" placeholder="请输入姓名" autocomplete="off">
                    </div>
                    <div class="form-field">
                        <label class="form-label">职位（可多选）</label>
                        <div class="pos-picker" id="editPosPicker"></div>
                    </div>
                    <div class="form-field">
                        <label class="form-label">联系方式</label>
                        <input id="editContact" class="form-input" type="text" placeholder="选填" autocomplete="off">
                    </div>
                    <div class="form-field">
                        <label class="form-label">重置密码（留空则不修改）</label>
                        <input id="editPassword" class="form-input" type="password" placeholder="至少 6 位" autocomplete="new-password">
                    </div>
                </div>
                <div class="modal-foot">
                    <button type="button" class="btn btn-outline" data-act="cancel-edit-member">取消</button>
                    <button type="button" class="btn btn-primary" id="editMemberBtn" data-act="save-member">保存</button>
                </div>
            </div>
        </div>

        <!-- 表单结果 / 催交 -->
        <div class="modal-overlay" id="formResultModal">
            <div class="modal">
                <div class="modal-head">
                    <span class="modal-title" id="formResultTitle">表单结果</span>
                    <button type="button" class="modal-close" data-act="close-modal" data-arg="formResultModal" aria-label="关闭">
                        <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><line x1="18" y1="6" x2="6" y2="18"/><line x1="6" y1="6" x2="18" y2="18"/></svg>
                    </button>
                </div>
                <div class="modal-body">
                    <div class="detail-meta" id="formResultMeta"></div>
                    <div class="form-field">
                        <label class="form-label">未交名单</label>
                        <div class="info-list" id="formPendingList"></div>
                        <button type="button" class="btn btn-outline btn-block mt-8" data-act="copy-pending">复制未交名单</button>
                    </div>
                    <div class="form-field">
                        <label class="form-label">提交明细</label>
                        <!-- 按需加载：明细是「每人一条 × 全部答案」，最重的一个请求，点了才拉（见 loadFormSubs） -->
                        <button type="button" class="btn btn-outline btn-block" id="formSubsBtn" data-act="load-form-subs">查看提交明细</button>
                        <div id="formSubsList" class="mt-8"></div>
                    </div>
                </div>
                <div class="modal-foot">
                    <button type="button" class="btn btn-outline" data-act="close-modal" data-arg="formResultModal">关闭</button>
                    <button type="button" class="btn btn-primary" data-act="export-form">导出 CSV</button>
                </div>
            </div>
        </div>

        <!-- 修改表单时间 / 修改策略：只动截止时间和「允许修改」，字段与内容一律不碰 -->
        <div class="modal-overlay" id="formTimeModal">
            <div class="modal">
                <div class="modal-head">
                    <span class="modal-title">修改时间</span>
                    <button type="button" class="modal-close" data-act="close-modal" data-arg="formTimeModal" aria-label="关闭">
                        <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><line x1="18" y1="6" x2="6" y2="18"/><line x1="6" y1="6" x2="18" y2="18"/></svg>
                    </button>
                </div>
                <div class="modal-body">
                    <div class="form-error" id="formTimeError"></div>
                    <div class="form-field">
                        <label class="form-label" for="ftDeadline">截止时间（留空则长期开放）</label>
                        <input id="ftDeadline" class="form-input" type="datetime-local" data-empty-hint="未填写（长期开放）" autocomplete="off">
                    </div>
                    <div class="form-field mb-0">
                        <label class="form-label" for="ftEditPolicy">允许修改</label>
                        <select id="ftEditPolicy" class="form-input">
                            <option value="before_deadline">截止前可修改</option>
                            <option value="none">提交后不可修改</option>
                            <option value="always">随时可修改</option>
                        </select>
                    </div>
                </div>
                <div class="modal-foot">
                    <button type="button" class="btn btn-outline" data-act="close-modal" data-arg="formTimeModal">取消</button>
                    <button type="button" class="btn btn-primary" id="formTimeBtn" data-act="save-form-time">保存</button>
                </div>
            </div>
        </div>
    </div>

    <script src="assets/js/app.js"></script>
    <script src="assets/js/admin.js"></script>
</body>
</html>
