<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
    <title>管理员面板 - 班级助理</title>
    <meta name="description" content="班级助理：管理员功能，发布活动、通知与管理班级成员。">
    <meta name="color-scheme" content="light dark">
    <meta name="theme-color" content="#f2f2f7" media="(prefers-color-scheme: light)">
    <meta name="theme-color" content="#07070c" media="(prefers-color-scheme: dark)">
    <link rel="icon" type="image/svg+xml" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 64 64'%3E%3Crect width='64' height='64' rx='14' fill='%232196f3'/%3E%3Cpath d='M16 24h32v18H26l-10 8z' fill='none' stroke='%23fff' stroke-width='3' stroke-linejoin='round'/%3E%3Cpath d='M24 30h16M24 34h10' stroke='%23fff' stroke-width='3' stroke-linecap='round'/%3E%3C/svg%3E">
    <link rel="stylesheet" href="assets/css/style.css">
    <script>
    /* 主题切换：localStorage('theme') 优先，其次跟随系统 prefers-color-scheme；同步写入 <html> 的 data-theme 防闪烁 */
    (function () {
        var KEY = 'theme';
        var root = document.documentElement;
        var mq = window.matchMedia('(prefers-color-scheme: dark)');
        function system() { return mq.matches ? 'dark' : 'light'; }
        function stored() { try { var v = localStorage.getItem(KEY); return (v === 'dark' || v === 'light') ? v : null; } catch (e) { return null; } }
        function apply(t) { root.setAttribute('data-theme', t); }
        function current() { return stored() || system(); }
        apply(current());
        function bind() {
            if (mq.addEventListener) mq.addEventListener('change', function (e) { if (!stored()) apply(e.matches ? 'dark' : 'light'); });
            else if (mq.addListener) mq.addListener(function (e) { if (!stored()) apply(e.matches ? 'dark' : 'light'); });
            window.addEventListener('storage', function (e) { if (e.key === KEY) apply(current()); });
        }
        if (document.readyState === 'loading') document.addEventListener('DOMContentLoaded', bind); else bind();
    })();
    </script>
</head>
<body>
    <div class="main">
        <div class="container">
            <div class="page-head">
                <h1 class="page-title">管理员面板</h1>
                <p class="page-desc">发布班级通知、活动，并管理班级成员。</p>
            </div>

            <div class="split-grid">
                <!-- ============ 左列：添加 ============ -->
                <div class="split-col">

                    <!-- 添加通知 -->
                    <div class="profile-card collapse" id="addNoticeCard" style="display:none;">
                        <button type="button" class="collapse-head" onclick="toggleCollapse('addNoticeCard')" aria-expanded="false">
                            <h2>添加通知</h2>
                            <svg class="collapse-arrow" width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><polyline points="6 9 12 15 18 9"/></svg>
                        </button>
                        <div class="collapse-body">
                            <div class="form-error" id="ntcError"></div>
                            <div class="form-field">
                                <label class="form-label">标题</label>
                                <input id="ntcTitle" class="form-input" type="text" placeholder="请输入通知标题" autocomplete="off">
                            </div>
                            <div class="form-field">
                                <label class="form-label">通知内容</label>
                                <textarea id="ntcContent" class="form-input" rows="4" placeholder="请输入通知内容"></textarea>
                            </div>
                            <div class="form-field">
                                <label class="form-label">发布时间</label>
                                <input id="ntcPublish" class="form-input" type="datetime-local" autocomplete="off">
                            </div>
                            <div class="form-field">
                                <label class="form-label">截止时间（未填写则长期通知）</label>
                                <input id="ntcExpire" class="form-input" type="datetime-local" data-empty-hint="未填写（长期有效）" autocomplete="off">
                            </div>
                            <div class="form-field">
                                <label class="form-label">提醒对象（未勾选则通知所有人）</label>
                                <div id="ntcRemind" class="remind-box"></div>
                            </div>
                            <button type="button" class="btn btn-primary btn-block" id="ntcSubmitBtn" onclick="submitNotice()">发布通知</button>
                        </div>
                    </div>

                    <!-- 添加活动 -->
                    <div class="profile-card collapse" id="addActivityCard" style="display:none;">
                        <button type="button" class="collapse-head" onclick="toggleCollapse('addActivityCard')" aria-expanded="false">
                            <h2>添加活动</h2>
                            <svg class="collapse-arrow" width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><polyline points="6 9 12 15 18 9"/></svg>
                        </button>
                        <div class="collapse-body">
                            <div class="form-error" id="actError"></div>
                            <div class="form-field">
                                <label class="form-label">标题</label>
                                <input id="actTitle" class="form-input" type="text" placeholder="请输入活动标题" autocomplete="off">
                            </div>
                            <div class="form-field">
                                <label class="form-label">活动说明</label>
                                <textarea id="actContent" class="form-input" rows="3" placeholder="选填，可填写时间安排、参与方式等"></textarea>
                            </div>
                            <div class="form-field">
                                <label class="form-label">活动地点</label>
                                <input id="actLocation" class="form-input" type="text" placeholder="选填" autocomplete="off">
                            </div>
                            <div class="form-field">
                                <label class="form-label">开始时间</label>
                                <input id="actStart" class="form-input" type="datetime-local" autocomplete="off">
                            </div>
                            <div class="form-field">
                                <label class="form-label">结束时间（未填写则仅当天有效）</label>
                                <input id="actEnd" class="form-input" type="datetime-local" data-empty-hint="未填写（仅当天）" autocomplete="off">
                            </div>
                            <div class="form-field">
                                <label class="form-label">提醒对象（未勾选则通知所有人）</label>
                                <div id="actRemind" class="remind-box"></div>
                            </div>
                            <button type="button" class="btn btn-primary btn-block" id="actSubmitBtn" onclick="submitActivity()">发布活动</button>
                        </div>
                    </div>

                    <!-- 管理成员 -->
                    <div class="profile-card collapse" id="membersCard" style="display:none;">
                        <button type="button" class="collapse-head" onclick="toggleCollapse('membersCard')" aria-expanded="false">
                            <h2>管理成员</h2>
                            <svg class="collapse-arrow" width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><polyline points="6 9 12 15 18 9"/></svg>
                        </button>
                        <div class="collapse-body">
                            <div class="form-field">
                                <input id="memberSearch" class="form-input" type="search" placeholder="搜索姓名 / 学号 / 职务" autocomplete="off" oninput="filterMembers()">
                            </div>
                            <div class="info-list" id="memberList"></div>
                        </div>
                    </div>
                </div>

                <!-- ============ 右列：添加成员 / 职位 ============ -->
                <div class="split-col">

                    <!-- 添加成员 -->
                    <div class="profile-card collapse" id="addMemberCard" style="display:none;">
                        <button type="button" class="collapse-head" onclick="toggleCollapse('addMemberCard')" aria-expanded="false">
                            <h2>添加成员</h2>
                            <svg class="collapse-arrow" width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><polyline points="6 9 12 15 18 9"/></svg>
                        </button>
                        <div class="collapse-body">
                            <div class="form-error" id="regError"></div>
                            <form id="regForm" novalidate>
                                <div class="form-field">
                                    <label class="form-label" for="regStudentId">学号</label>
                                    <input class="form-input" type="text" id="regStudentId" placeholder="请输入学号" autocomplete="off">
                                </div>
                                <div class="form-field">
                                    <label class="form-label" for="regName">姓名</label>
                                    <input class="form-input" type="text" id="regName" placeholder="请输入姓名" autocomplete="off">
                                </div>
                                <div class="form-field">
                                    <label class="form-label" for="regPassword">初始密码</label>
                                    <input class="form-input" type="password" id="regPassword" placeholder="至少 6 位" autocomplete="new-password">
                                </div>
                                <div class="form-field">
                                    <label class="form-label" for="regContact">联系方式</label>
                                    <input class="form-input" type="text" id="regContact" placeholder="选填" autocomplete="off">
                                </div>
                                <div class="form-field">
                                    <label class="form-label">职务（可多选，留空则为「学生」）</label>
                                    <div class="pos-picker" id="regPosPicker"></div>
                                </div>
                                <button class="btn btn-primary btn-block" id="regBtn" type="submit">注册成员</button>
                            </form>
                        </div>
                    </div>

                    <!-- 管理职位 -->
                    <div class="profile-card collapse" id="manageRolesCard" style="display:none;">
                        <button type="button" class="collapse-head" onclick="toggleCollapse('manageRolesCard')" aria-expanded="false">
                            <h2>管理职位</h2>
                            <svg class="collapse-arrow" width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><polyline points="6 9 12 15 18 9"/></svg>
                        </button>
                        <div class="collapse-body">
                            <div class="info-list" id="roleList"></div>
                        </div>
                    </div>

                    <!-- 添加职位 -->
                    <div class="profile-card collapse" id="addRoleCard" style="display:none;">
                        <button type="button" class="collapse-head" onclick="toggleCollapse('addRoleCard')" aria-expanded="false">
                            <h2>添加职位</h2>
                            <svg class="collapse-arrow" width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><polyline points="6 9 12 15 18 9"/></svg>
                        </button>
                        <div class="collapse-body">
                            <div class="form-error" id="roleError"></div>
                            <div class="form-field">
                                <label class="form-label" for="roleName">职位名称</label>
                                <input id="roleName" class="form-input" type="text" placeholder="如：团员、文艺委员" autocomplete="off">
                            </div>
                            <div class="form-field">
                                <label class="form-label">该职位的权限（可选，不勾选则仅为称号）</label>
                                <label style="display:block; margin:6px 0;"><input type="checkbox" id="rolePermWrite" value="content:write"> 可发布 / 修改 / 删除 活动、通知</label>
                                <label style="display:block; margin:6px 0;"><input type="checkbox" id="rolePermManage" value="user:manage"> 可注册账号、管理班级成员、添加 / 管理职位</label>
                            </div>
                            <button type="button" class="btn btn-primary btn-block" id="roleAddBtn" onclick="addRole()">添加职位</button>
                        </div>
                    </div>
                </div>
            </div>
        </div>

        <!-- ============ 编辑弹窗 ============ -->
        <!-- 编辑成员 -->
        <div class="modal-overlay" id="editMemberModal">
            <div class="modal">
                <div class="modal-head">
                    <span class="modal-title" id="editMemberTitle">编辑成员</span>
                    <button type="button" class="modal-close" onclick="cancelEditMember()" aria-label="关闭">
                        <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><line x1="18" y1="6" x2="6" y2="18"/><line x1="6" y1="6" x2="18" y2="18"/></svg>
                    </button>
                </div>
                <div class="modal-body">
                    <div class="form-error" id="editMemberError"></div>
                    <div class="form-field">
                        <label class="form-label">姓名</label>
                        <input id="editName" class="form-input" type="text" placeholder="请输入姓名" autocomplete="off">
                    </div>
                    <div class="form-field">
                        <label class="form-label">职务（可多选）</label>
                        <div class="pos-picker" id="editPosPicker"></div>
                    </div>
                    <div class="form-field">
                        <label class="form-label">联系方式</label>
                        <input id="editContact" class="form-input" type="text" placeholder="选填" autocomplete="off">
                    </div>
                    <div class="form-field">
                        <label class="form-label">重置密码（留空则不修改）</label>
                        <input id="editPassword" class="form-input" type="password" placeholder="至少 6 位" autocomplete="new-password">
                    </div>
                </div>
                <div class="modal-foot">
                    <button type="button" class="btn btn-outline" onclick="cancelEditMember()">取消</button>
                    <button type="button" class="btn btn-primary" id="editMemberBtn" onclick="saveMember()">保存</button>
                </div>
            </div>
        </div>
    </div>

    <script src="assets/js/app.js"></script>
    <script>
    (function () {
    // ===== 需要登录 + 至少一项管理/发布权限 =====
    if (!requireAuth()) return;
    var canWrite = canContentWrite();
    var canManage = canManageUsers();
    if (!canWrite && !canManage) {
        document.querySelector('.container').innerHTML = stateHTML('无权访问该页面', true);
        return;
    }

    // ===== 提醒对象选择（发布 通知、活动共用） =====
    var remindChoices = [];

    async function loadRemindChoices() {
        try {
            var res = await api('/api/auth/members-pick');
            remindChoices = (res.data && res.data.list) || [];
        } catch (e) {}
        renderRemindChoices('actRemind', []);
        renderRemindChoices('ntcRemind', []);
    }

    function renderRemindChoices(boxId, checkedNames) {
        renderRemindBox(boxId, remindChoices, checkedNames);
    }

    function collectRemind(boxId) {
        var names = [];
        document.querySelectorAll('#' + boxId + ' .remind-cb:checked').forEach(function (el) { names.push(el.value); });
        return names;
    }

    // ===== 卡片折叠（默认收起，点击标题行展开/收起） =====
    function toggleCollapse(id) {
        var card = document.getElementById(id);
        if (!card) return;
        var open = card.classList.toggle('open');
        var head = card.querySelector('.collapse-head');
        if (head) head.setAttribute('aria-expanded', open ? 'true' : 'false');
    }

    // ===== 编辑弹窗：打开 / 关闭（成员） =====
    var MODAL_IDS = ['editMemberModal'];
    function openModal(id) {
        var el = document.getElementById(id);
        if (!el) return;
        el.classList.add('show');
        document.body.style.overflow = 'hidden';
    }
    function closeModal(id) {
        var el = document.getElementById(id);
        if (!el) return;
        el.classList.remove('show');
        document.body.style.overflow = '';
    }
    MODAL_IDS.forEach(function (id) {
        var el = document.getElementById(id);
        if (!el) return;
        el.addEventListener('click', function (e) { if (e.target === el) closeModal(id); });
    });
    document.addEventListener('keydown', function (e) {
        if (e.key !== 'Escape') return;
        MODAL_IDS.forEach(function (id) {
            var el = document.getElementById(id);
            if (el && el.classList.contains('show')) closeModal(id);
        });
    });

    // ===== 添加通知 =====
    async function submitNotice() {
        var errBox = document.getElementById('ntcError');
        errBox.classList.remove('show');
        var title = document.getElementById('ntcTitle').value.trim();
        var content = document.getElementById('ntcContent').value.trim();
        var publish_time = document.getElementById('ntcPublish').value;
        var expire_time = document.getElementById('ntcExpire').value || null;
        if (!title || !content || !publish_time) {
            errBox.textContent = '标题、内容、发布时间为必填';
            errBox.classList.add('show'); return;
        }
        var btn = document.getElementById('ntcSubmitBtn');
        btn.disabled = true; var t = btn.textContent; btn.textContent = '提交中…';
        try {
            var body = { title: title, content: content, publish_time: publish_time, expire_time: expire_time, remind_people: collectRemind('ntcRemind') };
            await api('/api/notices', { method: 'POST', body: JSON.stringify(body) });
            document.getElementById('ntcTitle').value = '';
            document.getElementById('ntcContent').value = '';
            document.getElementById('ntcPublish').value = nowLocal();
            document.getElementById('ntcExpire').value = todayEnd();
            refreshDateHints();
            renderRemindChoices('ntcRemind', []);
            errBox.textContent = '发布成功';
            errBox.classList.add('show');
        } catch (err) {
            errBox.textContent = err.message;
            errBox.classList.add('show');
        } finally {
            btn.disabled = false; btn.textContent = t;
        }
    }

    // ===== 添加活动 =====
    async function submitActivity() {
        var errBox = document.getElementById('actError');
        errBox.classList.remove('show');
        var title = document.getElementById('actTitle').value.trim();
        var content = document.getElementById('actContent').value.trim();
        var location = document.getElementById('actLocation').value.trim();
        var start_time = document.getElementById('actStart').value;
        var end_time = document.getElementById('actEnd').value;
        if (!title || !start_time) {
            errBox.textContent = '标题、开始时间为必填';
            errBox.classList.add('show'); return;
        }
        var btn = document.getElementById('actSubmitBtn');
        btn.disabled = true; var t = btn.textContent; btn.textContent = '提交中…';
        try {
            var body = { title: title, content: content, location: location, start_time: start_time, end_time: end_time, remind_people: collectRemind('actRemind') };
            await api('/api/activities', { method: 'POST', body: JSON.stringify(body) });
            document.getElementById('actTitle').value = '';
            document.getElementById('actContent').value = '';
            document.getElementById('actLocation').value = '';
            document.getElementById('actStart').value = nowLocal();
            document.getElementById('actEnd').value = todayEnd();
            refreshDateHints();
            renderRemindChoices('actRemind', []);
            errBox.textContent = '发布成功';
            errBox.classList.add('show');
        } catch (err) {
            errBox.textContent = err.message;
            errBox.classList.add('show');
        } finally {
            btn.disabled = false; btn.textContent = t;
        }
    }

    // ===== 管理成员（列表 + 编辑/删除） =====
    var membersCache = [];
    var editingMemberId = null;

    async function loadMembers() {
        var el = document.getElementById('memberList');
        el.innerHTML = stateHTML('加载中…');
        try {
            var res = await api('/api/auth/users');
            membersCache = (res.data && res.data.list) || [];
            filterMembers();
            renderRegPosPicker();   // 成员新增岗位后同步可选项
        } catch (err) {
            el.innerHTML = stateHTML(err.message, true);
        }
    }

    // 纯前端按关键词过滤成员（姓名 / 学号 / 职务）
    function filterMembers() {
        var el = document.getElementById('memberList');
        var box = document.getElementById('memberSearch');
        var q = box ? box.value.trim().toLowerCase() : '';
        var list = !q ? membersCache : membersCache.filter(function (m) {
            var pos = parsePositionsList(m.positions).join('、');
            return String(m.name || '').toLowerCase().indexOf(q) >= 0
                || String(m.student_id || '').toLowerCase().indexOf(q) >= 0
                || String(pos).toLowerCase().indexOf(q) >= 0;
        });
        if (!list.length) { el.innerHTML = stateHTML(q ? '没有匹配的成员' : '暂无成员'); return; }
        el.innerHTML = list.map(function (m) {
            return '<div class="info-row member-row">'
                + '<div class="member-main">'
                + '<div class="member-line">'
                + '<span class="member-name">' + esc(m.name) + '</span>'
                + '<span class="member-pos">' + positionsChipsHTML(m.positions) + '</span>'
                + '</div>'
                + '<div class="member-sub">学号 ' + esc(m.student_id) + '</div>'
                + '</div>'
                + '<div class="member-actions">'
                + '<button type="button" class="btn btn-outline" onclick="startEditMember(' + m.id + ')">编辑</button>'
                + '<button type="button" class="btn btn-danger" onclick="delMember(' + m.id + ')">删除</button>'
                + '</div>'
                + '</div>';
        }).join('');
    }

    // 预设职务（可多选）
    var POSITION_PRESETS = ['班长', '团支书', '学习委员'];
    // 与后端 ROLE_PERMISSIONS 保持一致，用于「管理职位」中展示默认职位权限
    var PRESET_PERMISSIONS = {
        '班长': ['content:write', 'user:manage'],
        '团支书': ['content:write', 'user:manage'],
        '学习委员': ['content:write']
    };
    var rolesCache = [];   // roles 表：已定义的自定义职位

    // 汇总可选职务：预设 + roles 表已定义 + 成员已在用 + 当前已选（去重，排除「学生」）
    function allPositionNames(selected) {
        var names = POSITION_PRESETS.slice();
        function push(p) {
            p = String(p == null ? '' : p).trim();
            if (p && p !== '学生' && names.indexOf(p) < 0) names.push(p);
        }
        (rolesCache || []).forEach(function (r) { push(r.name); });
        (membersCache || []).forEach(function (m) {
            parsePositionsList(m.positions).forEach(push);
        });
        (selected || []).forEach(push);
        return names;
    }

    // 渲染职务多选标签
    function renderPosPicker(boxId, selected) {
        var box = document.getElementById(boxId);
        if (!box) return;
        var sel = {};
        (selected || []).forEach(function (p) { sel[p] = true; });
        box.innerHTML = allPositionNames(selected).map(function (p) {
            var chk = sel[p] ? ' checked' : '';
            return '<label class="chip"><input type="checkbox" class="pos-cb" value="' + esc(p) + '"' + chk + '>' + esc(p) + '</label>';
        }).join('');
    }

    // 注册表单的职务选择器（保留当前勾选）
    function renderRegPosPicker() {
        var checked = [];
        document.querySelectorAll('#regPosPicker .pos-cb:checked').forEach(function (cb) { checked.push(cb.value); });
        renderPosPicker('regPosPicker', checked);
    }

    // 加载 roles 表已定义的自定义职位（同步「管理职位」列表与各职务选择器）
    async function loadRoles() {
        var el = document.getElementById('roleList');
        if (el) el.innerHTML = stateHTML('加载中…');
        try {
            var res = await api('/api/auth/roles');
            rolesCache = (res.data && res.data.list) || [];
        } catch (e) { rolesCache = []; }
        renderRoleList();
        renderRegPosPicker();
    }

    // 权限码 → 中文
    var PERM_LABELS = { 'content:write': '发布内容', 'user:manage': '成员与职位管理' };
    function permLabels(list) {
        if (!list || !list.length) return '无特殊权限';
        return list.map(function (k) { return PERM_LABELS[k] || k; }).join('、');
    }
    function rolePermText(permissions) {
        var arr = [];
        try { var p = JSON.parse(permissions); if (Array.isArray(p)) arr = p; } catch (e) {}
        return permLabels(arr);
    }

    // 渲染「管理职位」列表：默认职位置顶（不可修改 / 删除），其下为自定义职位
    function renderRoleList() {
        var el = document.getElementById('roleList');
        if (!el) return;
        var preset = POSITION_PRESETS.map(function (name) {
            return '<div class="info-row member-row">'
                + '<div class="member-main">'
                + '<div class="member-line">'
                + '<span class="member-name">' + esc(name) + '</span>'
                + '<span class="member-pos">默认</span>'
                + '</div>'
                + '<div class="member-sub">' + esc(permLabels(PRESET_PERMISSIONS[name] || [])) + '</div>'
                + '</div>'
                + '</div>';
        }).join('');
        var custom = rolesCache.map(function (r) {
            return '<div class="info-row member-row">'
                + '<div class="member-main">'
                + '<div class="member-line">'
                + '<span class="member-name">' + esc(r.name) + '</span>'
                + '<span class="member-pos">自定义</span>'
                + '</div>'
                + '<div class="member-sub">' + esc(rolePermText(r.permissions)) + '</div>'
                + '</div>'
                + '<div class="member-actions">'
                + '<button type="button" class="btn btn-danger" onclick="delRole(' + r.id + ')">删除</button>'
                + '</div>'
                + '</div>';
        }).join('');
        el.innerHTML = '<div class="roles-group-label">默认职位（不可修改 / 删除）</div>'
            + preset
            + '<div class="roles-group-label">自定义职位</div>'
            + (rolesCache.length ? custom : stateHTML('暂无自定义职位'));
    }

    // 添加自定义职位（同名则更新其权限）
    async function addRole() {
        var errBox = document.getElementById('roleError');
        errBox.classList.remove('show');
        var name = document.getElementById('roleName').value.trim();
        if (!name) { errBox.textContent = '职位名称不能为空'; errBox.classList.add('show'); return; }
        var permissions = [];
        if (document.getElementById('rolePermWrite').checked) permissions.push('content:write');
        if (document.getElementById('rolePermManage').checked) permissions.push('user:manage');
        var btn = document.getElementById('roleAddBtn');
        btn.disabled = true; var t = btn.textContent; btn.textContent = '添加中…';
        try {
            await api('/api/auth/roles', { method: 'POST', body: JSON.stringify({ name: name, permissions: permissions }) });
            document.getElementById('roleName').value = '';
            document.getElementById('rolePermWrite').checked = false;
            document.getElementById('rolePermManage').checked = false;
            errBox.textContent = '添加成功';
            errBox.classList.add('show');
            loadRoles();
        } catch (err) {
            errBox.textContent = err.message;
            errBox.classList.add('show');
        } finally {
            btn.disabled = false; btn.textContent = t;
        }
    }

    async function delRole(id) {
        if (!confirm('确定删除该职位？')) return;
        try {
            await api('/api/auth/roles/' + id, { method: 'DELETE' });
            loadRoles();
        } catch (err) { alert(err.message); }
    }

    // 编辑弹窗的职务选择器
    function renderEditPosPicker(selected) {
        renderPosPicker('editPosPicker', selected);
    }

    function startEditMember(id) {
        var m = (membersCache || []).filter(function (x) { return x.id === id; })[0];
        if (!m) { alert('未找到该成员'); return; }
        document.getElementById('editMemberTitle').textContent = '编辑成员';
        document.getElementById('editName').value = m.name || '';
        renderEditPosPicker(parsePositionsList(m.positions));
        document.getElementById('editContact').value = m.contact || '';
        document.getElementById('editPassword').value = '';
        document.getElementById('editMemberError').classList.remove('show');
        editingMemberId = id;
        openModal('editMemberModal');
    }

    function cancelEditMember() {
        closeModal('editMemberModal');
        editingMemberId = null;
    }

    async function saveMember() {
        var errBox = document.getElementById('editMemberError');
        errBox.classList.remove('show');
        var name = document.getElementById('editName').value.trim();
        var contact = document.getElementById('editContact').value.trim();
        var password = document.getElementById('editPassword').value;
        if (!name) { errBox.textContent = '姓名不能为空'; errBox.classList.add('show'); return; }
        if (password && password.length < 6) { errBox.textContent = '新密码长度至少 6 位'; errBox.classList.add('show'); return; }
        var positions = [];
        document.querySelectorAll('#editPosPicker .pos-cb:checked').forEach(function (cb) { positions.push(cb.value); });
        var btn = document.getElementById('editMemberBtn');
        btn.disabled = true; var t = btn.textContent; btn.textContent = '保存中…';
        try {
            var payload = { name: name, positions: positions, contact: contact };
            if (password) payload.password = password;
            await api('/api/auth/users/' + editingMemberId, { method: 'PUT', body: JSON.stringify(payload) });
            cancelEditMember();
            loadMembers();
        } catch (err) {
            errBox.textContent = err.message;
            errBox.classList.add('show');
        } finally {
            btn.disabled = false; btn.textContent = t;
        }
    }

    async function delMember(id) {
        if (!confirm('确定删除该成员账号？')) return;
        try {
            await api('/api/auth/users/' + id, { method: 'DELETE' });
            loadMembers();
        } catch (err) {
            alert(err.message);
        }
    }

    // ===== 添加成员 =====
    function initMemberManagement() {
        var regForm = document.getElementById('regForm');
        regForm.addEventListener('submit', async function (e) {
            e.preventDefault();
            var errBox = document.getElementById('regError');
            errBox.classList.remove('show');
            var student_id = document.getElementById('regStudentId').value.trim();
            var name = document.getElementById('regName').value.trim();
            var password = document.getElementById('regPassword').value;
            var contact = document.getElementById('regContact').value.trim();
            // 多选职务标签
            var positions = [];
            document.querySelectorAll('#regPosPicker .pos-cb:checked').forEach(function (cb) { positions.push(cb.value); });
            if (!student_id || !name || !password) { errBox.textContent = '学号、姓名、密码为必填'; errBox.classList.add('show'); return; }
            if (password.length < 6) { errBox.textContent = '密码长度至少 6 位'; errBox.classList.add('show'); return; }
            var btn = document.getElementById('regBtn');
            btn.disabled = true; var t = btn.textContent; btn.textContent = '注册中…';
            try {
                var payload = { student_id: student_id, name: name, password: password, positions: positions, contact: contact };
                await api('/api/auth/register', { method: 'POST', body: JSON.stringify(payload) });
                errBox.classList.add('show');
                errBox.textContent = '注册成功';
                regForm.reset();
                loadMembers();
            } catch (err) {
                errBox.textContent = err.message;
                errBox.classList.add('show');
            } finally {
                btn.disabled = false; btn.textContent = t;
            }
        });
    }

    // ===== datetime-local 空值提示：用「未填写」替换原生的 yyyy/mm/dd 占位 =====
    function refreshDateHints() {
        var wraps = document.querySelectorAll('.dt-field');
        for (var i = 0; i < wraps.length; i++) {
            var inp = wraps[i].querySelector('input');
            wraps[i].classList.toggle('is-empty', !(inp && inp.value));
        }
    }
    function initDateHints() {
        var inputs = document.querySelectorAll('input[type="datetime-local"]');
        for (var i = 0; i < inputs.length; i++) {
            var input = inputs[i];
            var wrap = document.createElement('div');
            wrap.className = 'dt-field';
            input.parentNode.insertBefore(wrap, input);
            wrap.appendChild(input);
            var hint = document.createElement('span');
            hint.className = 'dt-hint';
            hint.textContent = input.getAttribute('data-empty-hint') || '未填写';
            wrap.appendChild(hint);
            input.addEventListener('input', refreshDateHints);
            input.addEventListener('change', refreshDateHints);
        }
        refreshDateHints();
    }

    // ===== 初始化：按权限显示对应区块 =====
    if (canWrite) {
        ['addNoticeCard', 'addActivityCard'].forEach(function (id) {
            document.getElementById(id).style.display = 'block';
        });
        document.getElementById('actStart').value = nowLocal();
        document.getElementById('actEnd').value = todayEnd();
        document.getElementById('ntcPublish').value = nowLocal();
        document.getElementById('ntcExpire').value = todayEnd();
        loadRemindChoices();
    }
    // 职位卡片：与「添加/管理成员」卡片一样正常显示，列表只读，增删在提交时由后端校验权限
    ['manageRolesCard', 'addRoleCard'].forEach(function (id) {
        document.getElementById(id).style.display = 'block';
    });
    loadRoles();

    if (canManage) {
        ['membersCard', 'addMemberCard'].forEach(function (id) {
            document.getElementById(id).style.display = 'block';
        });
        initMemberManagement();
        loadMembers();
    }

    // 默认值已填好后再接管日期输入的空值提示
    initDateHints();

    // 供内联 onclick 调用
    window.toggleCollapse = toggleCollapse;
    window.submitNotice = submitNotice;
    window.submitActivity = submitActivity;
    window.startEditMember = startEditMember;
    window.cancelEditMember = cancelEditMember;
    window.saveMember = saveMember;
    window.delMember = delMember;
    window.filterMembers = filterMembers;
    window.addRole = addRole;
    window.delRole = delRole;
    })();
    </script>
</body>
</html>
