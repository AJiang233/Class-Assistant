<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
    <title>我的待办 - 班级助理</title>
    <meta name="description" content="班级助理：我的待办清单，含截止提醒与班委代加。">
    <meta name="color-scheme" content="light dark">
    <meta name="theme-color" content="#f2f2f7" media="(prefers-color-scheme: light)">
    <meta name="theme-color" content="#07070c" media="(prefers-color-scheme: dark)">
    <link rel="icon" type="image/png" sizes="192x192" href="assets/icons/icon-192.png">
    <link rel="icon" type="image/png" sizes="512x512" href="assets/icons/icon-512.png">
    <link rel="manifest" href="manifest.json">
    <link rel="apple-touch-icon" href="assets/icons/apple-touch-icon.png">
    <!-- iOS 加到主屏后独立运行（无地址栏）。状态栏用 default：iOS 会为状态栏预留空间，
         内容不被刘海/状态栏压住；不用 black-translucent —— 它固定白色状态栏文字，浅色主题下看不见。 -->
    <meta name="apple-mobile-web-app-capable" content="yes">
    <meta name="mobile-web-app-capable" content="yes">
    <meta name="apple-mobile-web-app-status-bar-style" content="default">
    <meta name="apple-mobile-web-app-title" content="班级助理">
    <link rel="stylesheet" href="assets/css/style.css">
    <script src="assets/js/theme.js"></script>
</head>
<body>
    <div class="main">
        <div class="container">
            <div class="page-head">
                <h1 class="page-title">我的待办</h1>
                <p class="page-desc">自己的作业、考试与杂事都记在这里；截止前会按「红色 / 黄色」两档提醒，班委也可以直接给你加一条。</p>
            </div>

            <!-- 操作区：新建 / 提醒设置 / 代加（代加只对 content:write 显示，见 todos.js） -->
            <div class="todo-toolbar">
                <button type="button" class="btn btn-primary" data-act="new-todo">+ 新建待办</button>
                <button type="button" class="btn btn-outline" data-act="open-prefs">提醒设置</button>
                <button type="button" class="btn btn-outline" id="delegateBtn" hidden data-act="open-delegate">代加待办</button>
            </div>

            <!-- 进行中 / 历史 分段控件。滑块（.tab-pill）由 todos.js 的 moveSegPill() 定位，
                 与学业页的三段控件同一套实现。 -->
            <div class="tabs todo-seg" id="todoSeg">
                <span class="tab-pill" id="todoSegPill" aria-hidden="true"></span>
                <button type="button" class="tab active" data-act="switch-tab" data-tab="open">进行中</button>
                <button type="button" class="tab" data-act="switch-tab" data-tab="history">历史</button>
            </div>

            <!-- 一次性提示（如「已给 3 位同学添加待办」）：不打断操作，几秒后自己消失 -->
            <div class="todo-flash" id="todoFlash" hidden></div>

            <!-- 标签筛选：点位由 renderTagFilter() 生成（全部 + 各标签） -->
            <div class="todo-filters" id="tagFilter"></div>

            <!-- 历史页顶部的一句统计：「共 N 条历史待办，其中 M 条超时」 -->
            <p class="todo-history-note" id="historyNote" hidden></p>

            <div id="todoList"></div>

            <!-- 一页最多 100 条：还有更多时给一个「加载更多」，不一次性把整个列表拉下来 -->
            <div class="todo-more-wrap">
                <button type="button" class="btn btn-outline btn-block mt-12" id="moreBtn" hidden data-act="load-more">加载更多</button>
            </div>

            <!-- 新建 / 编辑 / 代加 三合一弹窗。三者的字段完全一样，差的只是：
                 1) 标题文案；2) 代加模式多一块成员多选；3) 提交的接口。
                 合成一个弹窗是为了少维护两份几乎相同的表单。 -->
            <div class="modal-overlay" id="todoModal">
                <div class="modal">
                    <div class="modal-head">
                        <span class="modal-title" id="todoModalTitle">新建待办</span>
                        <button type="button" class="modal-close" data-act="cancel-todo" aria-label="关闭">
                            <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><line x1="18" y1="6" x2="6" y2="18"/><line x1="6" y1="6" x2="18" y2="18"/></svg>
                        </button>
                    </div>
                    <div class="modal-body">
                        <div class="form-error" id="todoError"></div>

                        <!-- 代加模式：先选人。名单是懒加载的（打开这个模式时才请求） -->
                        <div class="form-field" id="memberField" hidden>
                            <label class="form-label">加给谁</label>
                            <div class="todo-member-head">
                                <button type="button" class="btn btn-outline btn-sm" data-act="select-all-members">全选</button>
                                <span class="todo-member-hint" id="memberHint"></span>
                            </div>
                            <div class="remind-members" id="memberBox"></div>
                        </div>

                        <div class="form-field">
                            <label class="form-label" for="tdTitle">标题</label>
                            <input class="form-input" id="tdTitle" maxlength="100" autocomplete="off" placeholder="例如：交形式与政策作业">
                        </div>
                        <div class="form-field">
                            <label class="form-label" for="tdDesc">说明（选填）</label>
                            <textarea class="form-input" id="tdDesc" rows="3" maxlength="1000" placeholder="补充提交方式、地点等"></textarea>
                        </div>
                        <div class="form-field">
                            <label class="form-label" for="tdStart">开始时间（选填）</label>
                            <input class="form-input" type="datetime-local" id="tdStart">
                        </div>
                        <div class="form-field">
                            <label class="form-label" for="tdDue">截止时间</label>
                            <input class="form-input" type="datetime-local" id="tdDue">
                        </div>
                        <div class="form-field">
                            <label class="form-label">标签（最多 4 个）</label>
                            <div class="todo-tag-picker" id="tagPicker"></div>
                            <div class="todo-tag-add">
                                <input class="form-input" id="tagInput" maxlength="12" autocomplete="off" placeholder="自定义标签（1–12 字）">
                                <button type="button" class="btn btn-outline" data-act="add-tag">添加</button>
                            </div>
                        </div>
                    </div>
                    <div class="modal-foot">
                        <button type="button" class="btn btn-outline" data-act="cancel-todo">取消</button>
                        <button type="button" class="btn btn-primary" id="todoSubmitBtn">保存</button>
                    </div>
                </div>
            </div>

            <!-- 提醒设置弹窗 -->
            <div class="modal-overlay" id="prefsModal">
                <div class="modal">
                    <div class="modal-head">
                        <span class="modal-title">提醒设置</span>
                        <button type="button" class="modal-close" data-act="cancel-prefs" aria-label="关闭">
                            <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><line x1="18" y1="6" x2="6" y2="18"/><line x1="6" y1="6" x2="18" y2="18"/></svg>
                        </button>
                    </div>
                    <div class="modal-body">
                        <div class="form-error" id="prefsError"></div>
                        <p class="page-desc">离截止还剩多少小时时算「该留神了」。红色档要比黄色档更近。</p>
                        <div class="form-field">
                            <label class="form-label" for="pfUrgent">红色提醒（小时前，1–168）</label>
                            <input class="form-input" type="number" id="pfUrgent" min="1" max="168" step="1">
                        </div>
                        <div class="form-field">
                            <label class="form-label" for="pfWarn">黄色提醒（小时前，2–720）</label>
                            <input class="form-input" type="number" id="pfWarn" min="2" max="720" step="1">
                        </div>
                        <!-- 到期前提醒：只有 App 壳能真的弹通知（原生 AlarmManager 排期）；
                             网页版没有桥，这一块保持隐藏，不出现一个设了也没用的选项。 -->
                        <div class="form-field" id="pfRemindField" hidden>
                            <label class="form-label" for="pfRemind">到期前多久弹通知</label>
                            <select class="form-input" id="pfRemind">
                                <option value="0">不提醒</option>
                                <option value="10">提前 10 分钟</option>
                                <option value="30">提前 30 分钟</option>
                                <option value="60">提前 1 小时</option>
                                <option value="120">提前 2 小时</option>
                                <option value="180">提前 3 小时</option>
                                <option value="360">提前 6 小时</option>
                                <option value="720">提前 12 小时</option>
                                <option value="1440">提前 1 天</option>
                            </select>
                            <p class="page-desc" id="pfRemindStatus"></p>
                        </div>
                    </div>
                    <div class="modal-foot">
                        <button type="button" class="btn btn-outline" data-act="cancel-prefs">取消</button>
                        <button type="button" class="btn btn-primary" id="prefsSubmitBtn">保存</button>
                    </div>
                </div>
            </div>
        </div>
    </div>

    <script src="assets/js/app.js"></script>
    <script src="assets/js/todos.js"></script>
</body>
</html>
