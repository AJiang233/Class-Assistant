name = "class-assistant-api"
main = "src/index.js"
compatibility_date = "2024-09-01"

[[d1_databases]]
binding = "DB"
database_name = "class-assistant"
# 替换为你的真实 D1 数据库 ID（Cloudflare Dashboard → D1 → 选择数据库）
