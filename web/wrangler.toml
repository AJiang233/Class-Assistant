# =============================================================
# Class Assistant · Pages 本地开发配置（仅 wrangler pages dev 使用）
# 生产环境的绑定在 Cloudflare Pages 面板配置：
#   Settings → Functions → D1 database bindings（变量名 DB）
#   Settings → Environment variables（JWT_SECRET）
# 构建根目录：web/（Pages 项目根目录，直接部署本层）
# =============================================================

name = "class-assistant"
compatibility_date = "2024-09-01"

[[d1_databases]]
binding = "DB"
database_name = "class-assistant-db"
# 替换为你的真实 D1 数据库 ID（Cloudflare Dashboard → D1 → 选择数据库）
database_id = "6444f4bb-5197-4a53-a12b-264410e99f81"

[vars]
# JWT 过期时间（秒），默认 7 天
JWT_EXPIRES_IN = "604800"
# JWT_SECRET / COOKIE_SECRET 不进仓库。
# 本地：复制 .dev.vars.example 为 .dev.vars
# 生产：Pages → Settings → Environment variables（Secrets）
