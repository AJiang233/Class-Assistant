<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
    <title>填写表单 - 班级助理</title>
    <meta name="description" content="班级助理：填写班委下发的表单。">
    <meta name="color-scheme" content="light dark">
    <meta name="theme-color" content="#f2f2f7" media="(prefers-color-scheme: light)">
    <meta name="theme-color" content="#07070c" media="(prefers-color-scheme: dark)">
    <link rel="icon" type="image/svg+xml" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 64 64'%3E%3Crect width='64' height='64' rx='14' fill='%232196f3'/%3E%3Cpath d='M16 24h32v18H26l-10 8z' fill='none' stroke='%23fff' stroke-width='3' stroke-linejoin='round'/%3E%3Cpath d='M24 30h16M24 34h10' stroke='%23fff' stroke-width='3' stroke-linecap='round'/%3E%3C/svg%3E">
    <link rel="icon" type="image/png" href="assets/icons/icon-192.png">
    <link rel="manifest" href="manifest.json">
    <link rel="apple-touch-icon" href="assets/icons/apple-touch-icon.png">
    <!-- iOS 加到主屏后独立运行（无地址栏）。状态栏用 default：iOS 会为状态栏预留空间，
         内容不被刘海/状态栏压住；不用 black-translucent —— 它固定白色状态栏文字，浅色主题下看不见。 -->
    <meta name="apple-mobile-web-app-capable" content="yes">
    <meta name="mobile-web-app-capable" content="yes">
    <meta name="apple-mobile-web-app-status-bar-style" content="default">
    <meta name="apple-mobile-web-app-title" content="班级助理">
    <link rel="stylesheet" href="assets/css/style.css">
    <script src="assets/js/theme.js"></script>
</head>
<body>
    <div class="main">
        <div class="container">
            <div id="loadingView">
                <div class="page-head">
                    <h1 class="page-title">表单</h1>
                    <p class="page-desc" id="loadingTip">正在加载表单…</p>
                </div>
                <div id="skeletonHost"></div>
            </div>

            <div id="formView" hidden>
                <div class="page-head">
                    <h1 class="page-title" id="formTitle"></h1>
                    <p class="page-desc" id="formDesc"></p>
                    <p class="page-desc" id="formMeta"></p>
                </div>
                <div id="formCard"></div>
                <div class="form-error" id="formError"></div>
                <button type="button" class="btn btn-primary btn-block" id="submitBtn">提交</button>
                <button type="button" class="btn btn-outline btn-block mt-10" id="backBtn">返回首页</button>
            </div>
        </div>
    </div>

    <script src="assets/js/app.js"></script>
    <script src="assets/js/forms.js"></script>
</body>
</html>
